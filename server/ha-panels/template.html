<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Assistant panel</title>
<!-- HA_PANEL_CONFIG -->
<script src="/plugin-sdk/v1.js"></script>
<style>
/* Home Assistant panel (issue #252): one template draws every panel from its
   recipe. Colors, radii, type and levels come from the theme's role tokens
   (the SDK writes them onto :root), each with a fallback. */
:root {
  --acc: var(--accent, #3a7cc4);
  --ink: var(--text, #1e2b3a);
  --ink-2: var(--text-secondary, #5a6b7d);
  --on-bg: var(--hg-button-bg, var(--acc));
  --on-ink: var(--hg-button-text, #ffffff);
  --level: var(--hg-meter-fill, var(--acc));
  --level-track: var(--hg-meter-track, rgba(127, 127, 127, 0.18));
  --tile-bg: color-mix(in srgb, var(--ink) 6%, transparent);
  --tile-radius: var(--hg-radius-md, 14px);
  --warn: var(--warning, #c9822b);
  --err: var(--hg-error, #c43d3d);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent !important; }
body {
  color: var(--ink);
  font-family: var(--hg-font-body, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overflow: hidden;
}
#app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: clamp(6px, 2vmin, 12px); overflow: auto; }
.banner { margin: 0; padding: 8px 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; line-height: 1.35;
  background: color-mix(in srgb, var(--warn) 16%, transparent); }
.banner.error { background: color-mix(in srgb, var(--err) 14%, transparent); }
.grid { display: grid; gap: clamp(6px, 1.8vmin, 10px); grid-auto-flow: dense;
  grid-template-columns: repeat(var(--cols, auto-fill), minmax(var(--min, clamp(86px, 24vmin, 150px)), 1fr));
  grid-auto-rows: minmax(clamp(78px, 22vmin, 140px), auto); }
.grid.fixed { --min: 0px; }
/* Tiles fill the widget: the script picks the columns (fitColumns) and rows
   share the height. A row is never shorter than the smallest tile, nor than
   its tiles' words and controls need, so a crowded panel scrolls rather than
   squashing or cutting off its tiles. */
.grid.fit { flex: 1 1 0; min-height: 0; grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  grid-auto-rows: minmax(min-content, 1fr); }
.grid.fit .tile { min-height: var(--row, clamp(78px, 22vmin, 140px)); }
/* A tile's icon, words and padding grow with it: --t is the shorter side of
   a tile, in pixels, which the script works out with the columns. */
.grid.fit .tile { padding: clamp(8px, calc(var(--t, 0px) * 0.07), 22px); }
.grid.fit .ico { width: clamp(22px, calc(var(--t, 0px) * 0.26), 96px); height: clamp(22px, calc(var(--t, 0px) * 0.26), 96px); font-size: clamp(18px, calc(var(--t, 0px) * 0.22), 80px); }
.grid.fit .name { font-size: clamp(0.78rem, calc(var(--t, 0px) * 0.09), 1.8rem); }
.grid.fit .sub { font-size: clamp(0.7rem, calc(var(--t, 0px) * 0.06), 1.15rem); }
.grid.fit .big { font-size: clamp(1.1rem, calc(var(--t, 0px) * 0.2), 3.2rem); }
.grid.fit .btn { font-size: clamp(0.72rem, calc(var(--t, 0px) * 0.06), 1.1rem); min-height: clamp(36px, calc(var(--t, 0px) * 0.16), 56px); min-width: clamp(36px, calc(var(--t, 0px) * 0.16), 56px); }
.grid.fit .ring { width: clamp(26px, calc(var(--t, 0px) * 0.16), 48px); height: clamp(26px, calc(var(--t, 0px) * 0.16), 48px); }
.grid.fit .tile.camera { padding: 0; }
/* A fan's speeds: a segment for each, lit up to the one it is at. */
.speeds { display: flex; gap: 4px; width: 100%; max-width: 140px; position: relative; z-index: 2; }
.speeds span { flex: 1; height: clamp(4px, calc(var(--t, 0px) * 0.045), 9px); border-radius: 999px; background: color-mix(in srgb, var(--ink) 16%, transparent); transition: background 0.2s; }
.speeds span.lit { background: var(--acc); }
.tile.on .speeds span { background: color-mix(in srgb, var(--on-ink) 30%, transparent); }
.tile.on .speeds span.lit { background: var(--on-ink); }
body:not(.bold) .grid.fit.short .tile.fan .speeds { width: 48px; flex: none; }
/* Short rows: icon beside the name. */
.grid.fit.short .tile:not(.camera) { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; padding-block: 4px; }
.grid.fit.short .tile:not(.camera) > div:not(.top):not(.fill):not(.halves):not(.hint) { flex: 1; min-width: 0; }
.grid.fit.short .name { -webkit-line-clamp: 1; }
.grid.fit.short .chev { left: auto; right: 6px; transform: none; }
.grid.fit.short .chev.up { top: 4px; } .grid.fit.short .chev.down { bottom: 4px; top: auto; }
.grid.fit.short .tile:has(.chev) { padding-right: 30px; }
/* A one-tile panel: the tile is the whole widget. */
.solo #app { padding: 0; }
.solo .grid.fit .tile { border-radius: 0; min-height: 0; }
.offline .tile { opacity: 0.55; }

.tile { position: relative; overflow: hidden; min-width: 0; min-height: 0; border: 0; margin: 0; font: inherit; color: inherit;
  border-radius: var(--tile-radius); background: var(--tile-bg); padding: clamp(8px, 2.4vmin, 14px); text-align: left;
  display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background 0.2s, color 0.2s, transform 0.1s; }
.tile.w2 { grid-column: span 2; }
.tile.wf { grid-column: 1 / -1; }
.tile.h2 { grid-row: span 2; }
.tile.act { cursor: pointer; }
.tile.act:active { transform: scale(0.98); }
.tile:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.tile.on { background: var(--on-bg); color: var(--on-ink); }
.tile.on .sub { color: inherit; opacity: 0.85; }
.tile.missing { opacity: 0.5; }
.tile.flash { background: var(--on-bg); color: var(--on-ink); }
.tile.slide { touch-action: none; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; position: relative; z-index: 2; }
.ico { width: clamp(22px, 7vmin, 34px); height: clamp(22px, 7vmin, 34px); flex: none; display: grid; place-items: center; font-size: clamp(18px, 6vmin, 28px); line-height: 1; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tile:not(.on) .ico svg { stroke: var(--acc); }
.name { font-weight: 650; font-size: clamp(0.78rem, 3.4vmin, 1rem); line-height: 1.2; overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; position: relative; z-index: 2; }
.sub { font-size: clamp(0.7rem, 2.8vmin, 0.85rem); color: var(--ink-2); position: relative; z-index: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big { font-size: clamp(1.1rem, 7vmin, 2rem); font-weight: 700; line-height: 1.05; position: relative; z-index: 2; }
.badge { font-size: 0.68rem; font-weight: 700; padding: 0.2em 0.6em; border-radius: 999px; background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--ink); }

/* Levels: brightness and fan speed fill from the bottom, a shade's closed
   part from the top. Drawn in the theme's meter color. */
.fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--level); opacity: 0.85; transition: height 0.2s; z-index: 1; }
.fill.down { top: 0; bottom: auto; }
.tile.leveled { background: var(--tile-bg); color: var(--ink); }
.tile.leveled.on .sub { color: var(--ink-2); }

.row { display: flex; gap: 6px; flex-wrap: wrap; position: relative; z-index: 2; }
.btn { appearance: none; border: 0; font: inherit; font-weight: 650; font-size: clamp(0.72rem, 2.8vmin, 0.9rem); cursor: pointer;
  min-height: 36px; min-width: 36px; padding: 0 0.8em; border-radius: var(--hg-button-radius, 999px);
  background: color-mix(in srgb, var(--acc) 14%, transparent); color: inherit; }
.btn:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.btn.primary { background: var(--on-bg); color: var(--on-ink); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.halves { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr 1fr; z-index: 3; }
.halves button { appearance: none; border: 0; background: transparent; cursor: pointer; color: transparent; }
.halves button:focus-visible { outline: 3px solid var(--acc); outline-offset: -3px; border-radius: var(--tile-radius); }
.chev { position: absolute; left: 50%; transform: translateX(-50%); width: 18px; height: 18px; opacity: 0.6; z-index: 2; }
.chev.up { top: 6px; } .chev.down { bottom: 6px; }
input[type=range] { width: 100%; accent-color: var(--level); position: relative; z-index: 2; }
.cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; border-radius: var(--tile-radius); }
.tile.camera { padding: 0; justify-content: flex-end; }
.tile.camera .name { padding: 6px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.55)); color: #fff; }

/* Press and hold: a ring fills while held. */
.ring { position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; z-index: 4; opacity: 0; transition: opacity 0.1s; }
.ring circle { fill: none; stroke: var(--acc); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 69.1; stroke-dashoffset: 69.1; }
.tile.on .ring circle { stroke: var(--on-ink); }
.holding .ring { opacity: 1; }
.holding .ring circle { transition: stroke-dashoffset var(--hold-ms, 650ms) linear; stroke-dashoffset: 0; }
.hint { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 5; font-size: 0.72rem; font-weight: 650; text-align: center;
  padding: 4px 6px; border-radius: 8px; background: color-mix(in srgb, var(--ink) 80%, transparent); color: var(--background, #fff); }

/* Small widgets: a compact list. */
.list { display: flex; flex-direction: column; gap: 6px; }
.list .tile { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; min-height: 48px; padding: 6px 10px; }
.list .tile > div:not(.top):not(.fill):not(.halves):not(.hint) { flex: 1; min-width: 0; }
.list .tile .row { flex: none; }
.list .tile .top { align-items: center; }
.list .tile .big { font-size: 1rem; }
.list .tile .fill { left: 0; top: 0; bottom: 0; height: auto !important; width: var(--lvl, 0%); right: auto; }
.list .tile .fill.down { width: var(--lvl, 0%); }

/* Overlays: the PIN pad and option lists. */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 10px;
  background: color-mix(in srgb, var(--background, #000) 72%, transparent); }
.sheet { width: min(320px, 100%); max-height: 100%; overflow: auto; border-radius: var(--hg-radius-lg, 18px); padding: 14px;
  background: var(--surface, #fff); color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 10px; }
.sheet h2 { margin: 0; font-size: 1rem; }
.dots { display: flex; gap: 8px; justify-content: center; min-height: 14px; }
.dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--acc); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keys .btn { min-height: 48px; font-size: 1.1rem; }
.err { color: var(--err); font-size: 0.85rem; font-weight: 600; text-align: center; min-height: 1.2em; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opts .btn { min-height: 44px; text-align: left; border-radius: 10px; }
.opts .btn.current { background: var(--on-bg); color: var(--on-ink); }
.empty { margin: auto; text-align: center; color: var(--ink-2); font-size: 0.9rem; }
/* A short widget: a tighter PIN pad, so it fits. */
@media (max-height: 460px) {
  .overlay { padding: 4px; }
  .sheet { padding: 10px; gap: 6px; }
  .keys { gap: 5px; }
  .keys .btn { min-height: 34px; font-size: 1rem; }
}
/* Bold style (recipe.style 'bold'). Big centered icons that grow with the
   tile, solid "on" tiles with a soft glow, level fills whose words turn to the
   button text color where the fill covers them, and icons that move while a
   device is on. Every color is a theme role token, as above. Classic panels
   never get the .bold class, so none of this reaches them. */
@property --fl { syntax: '<percentage>'; inherits: true; initial-value: 0%; }
.bold .grid { flex: 1; min-height: 0; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  grid-auto-rows: minmax(clamp(64px, 15vmin, 110px), 1fr); }
.bold .grid .tile { container-type: size; padding: 0; }
/* The glow is the accent: a theme's button fill may be a gradient. */
.bold .grid .tile.on:not(.leveled), .bold .grid .tile.flash { box-shadow: 0 6px 18px color-mix(in srgb, var(--acc) 34%, transparent); }
.bold .grid .tile.leveled.on { box-shadow: 0 6px 18px color-mix(in srgb, var(--acc) 22%, transparent); }
.bold .grid .face { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3cqmin; padding: 6cqmin; text-align: center; min-width: 0; }
.bold .grid .face > * { max-width: 100%; min-width: 0; }
.bold .grid .face.passive { pointer-events: none; }
.bold .grid .face .top { justify-content: center; }
.bold .grid .face .row { justify-content: center; }
.bold .grid .face .speeds { width: 60%; margin-inline: auto; }
.bold .grid .face .ico { width: clamp(22px, 36cqmin, 120px); height: auto; aspect-ratio: 1; font-size: clamp(18px, 28cqmin, 96px); position: relative; color: var(--acc); }
.bold .grid .tile .face .ico svg { stroke: currentColor; overflow: visible; }
.bold .grid .tile.on:not(.leveled) .face .ico, .bold .grid .tile.flash .face .ico { color: var(--on-ink); }
.bold .grid .face .name { font-size: clamp(0.74rem, 10.5cqmin, 2.1rem); line-height: 1.15; }
.bold .grid .face .sub { font-size: clamp(0.62rem, 6.8cqmin, 1.2rem); font-weight: 600; }
.bold .grid .face .big { font-size: clamp(1.1rem, 22cqmin, 3.4rem); }
.bold .grid .face.rich { gap: 2cqmin; }
.bold .grid .face.rich .ico { width: clamp(20px, 22cqmin, 72px); }
.bold .grid .face.rich .big { font-size: clamp(1rem, 16cqmin, 2.6rem); }
.bold .grid .face.rich .row { flex-wrap: nowrap; gap: max(4px, 2cqmin); }
.bold .grid .face.rich .btn { min-height: clamp(28px, 18cqmin, 48px); min-width: clamp(28px, 18cqmin, 48px); padding: 0 0.6em; }
.bold .grid .tile.on:not(.leveled) .btn:not(.primary) { background: color-mix(in srgb, var(--on-ink) 16%, transparent); }
/* A small tile with controls drops its icon to make room. */
@container (max-height: 170px) {
  .bold .grid .face.rich .top { display: none; }
}
/* The hold ring circles the icon. */
.bold .grid .face .ring { position: absolute; inset: -14%; right: auto; top: auto; width: 128%; height: 128%; transform: rotate(-90deg); }
/* Levels: the fill is the "on" color, and a second copy of the face, in the
   "on" text color, shows only where the fill covers it. */
.bold .grid .tile .fill { height: var(--fl); background: var(--on-bg); opacity: 1; transition: none; }
.bold .grid .tile .fill.down { height: var(--fl); }
.bold .grid .tile .fill.down::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: color-mix(in srgb, var(--on-ink) 30%, transparent); }
.bold .grid .face.lit { z-index: 3; color: var(--on-ink); clip-path: inset(calc(100% - var(--fl)) 0 0 0); }
.bold .grid .tile.down .face.lit { clip-path: inset(0 0 calc(100% - var(--fl)) 0); }
.bold .grid .face.lit .ico { color: var(--on-ink); }
.bold .grid .tile .face.lit .sub { color: inherit; opacity: 0.9; }
.bold .grid .face.lit .ring circle { stroke: var(--on-ink); }
.bold .grid .face .chev { width: clamp(14px, 14cqmin, 40px); height: clamp(14px, 14cqmin, 40px); color: var(--acc); opacity: 1; }
.bold .grid .face.lit .chev { color: var(--on-ink); }
.bold .grid .face .chev.up { top: 3cqmin; } .bold .grid .face .chev.down { bottom: 3cqmin; }
.bold .grid .halves { z-index: 6; }
.bold .grid .halves button:active { background: color-mix(in srgb, var(--ink) 12%, transparent); }
/* While sliding: the level, large. */
.bold .grid .pct { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; max-width: none;
  font-weight: 800; font-size: clamp(1.2rem, 30cqmin, 4.5rem); letter-spacing: -0.02em; line-height: 1; }
.bold .grid .pct small { font-size: 0.38em; font-weight: 700; letter-spacing: 0; margin-top: 0.15em; }
.bold .grid .tile.sliding .pct { display: flex; }
.bold .grid .tile.sliding .face > :not(.pct) { opacity: 0.25; }
/* Short or wide tiles: the icon beside the name. */
@container (max-height: 110px) or (min-aspect-ratio: 8/5) {
  .bold .grid .face:not(.rich) { flex-direction: row; justify-content: flex-start; text-align: left; gap: max(6px, 4cqw); padding: 0 6%; }
  .bold .grid .face:not(.rich) .ico { width: clamp(18px, min(44cqh, 30cqw), 96px); flex: none; }
  .bold .grid .face:not(.rich) .name { font-size: clamp(0.7rem, min(22cqh, 8cqw), 2rem); }
  .bold .grid .face:not(.rich) .sub { font-size: clamp(0.58rem, min(17cqh, 5cqw), 1.2rem); }
  .bold .grid .face:not(.rich) .big { font-size: clamp(0.9rem, min(36cqh, 10cqw), 2.6rem); }
  .bold .grid .tile.down .face, .bold .grid .tile.chevs .face { padding-right: calc(7% + 34cqh); }
  .bold .grid .face:not(.rich) .speeds { position: absolute; left: 7%; right: 7%; bottom: 9%; width: auto; max-width: none; margin: 0; }
  .bold .grid .tile.fan .face:not(.rich) { padding-bottom: 12%; }
  .bold .grid .face .chev { left: auto; right: 5cqw; transform: none; width: clamp(12px, 30cqh, 30px); height: clamp(12px, 30cqh, 30px); }
  .bold .grid .face .chev.up { top: 10%; } .bold .grid .face .chev.down { bottom: 10%; }
}
@container (max-height: 46px) {
  .bold .grid .face:not(.rich) .sub { display: none; }
}

/* Icons that move while on (the panel's "Animate icons" switch). */
.bold .grid .face .glow { fill: currentColor; stroke: none; opacity: 0; }
.bold .grid .face .ray, .bold .grid .face .steam path { opacity: 0; }
.bold .grid .face .blades, .bold .grid .face .spin-slow, .bold .grid .face .sunrays { transform-origin: 12px 12px; transform-box: view-box; }
.bold .grid .face .drum { transform-origin: 12px 13px; transform-box: view-box; }
.bold.animate .tile.on .glow { animation: hgb-glow 2.8s ease-in-out infinite; }
.bold.animate .tile.on .ray { animation: hgb-twinkle 2.8s ease-in-out infinite; }
.bold.animate .tile.on .ray.r2 { animation-delay: 0.9s; }
.bold.animate .tile.on .ray.r3 { animation-delay: 1.8s; }
.bold.animate .tile.on .steam path { animation: hgb-rise 2.4s ease-in-out infinite; }
.bold.animate .tile.on .steam path:nth-child(2) { animation-delay: 0.8s; }
.bold.animate .tile.on .steam path:nth-child(3) { animation-delay: 1.6s; }
.bold.animate .tile.on .bulbs circle { animation: hgb-blink 1.8s ease-in-out infinite; }
.bold.animate .tile.on .bulbs circle:nth-child(2) { animation-delay: 0.6s; }
.bold.animate .tile.on .bulbs circle:nth-child(3) { animation-delay: 1.2s; }
.bold.animate .tile.on .blades { animation: hgb-spin var(--spin, 1.4s) linear infinite; }
.bold.animate .tile.on .drum { animation: hgb-spin 1.6s linear infinite; }
.bold.animate .tile.on .spin-slow { animation: hgb-spin 12s linear infinite; }
.bold.animate .tile.on .sunrays { animation: hgb-spin 18s linear infinite; }
.bold.animate .tile.on .star { animation: hgb-pulse 2.2s ease-in-out infinite; transform-origin: 12px 10px; transform-box: view-box; }
.bold.animate .tile.on .mini { animation: hgb-twinkle 2.2s ease-in-out infinite 0.7s; }
.bold.animate .tile.on .screen { animation: hgb-flick 3s ease-in-out infinite; }
.bold.animate .tile.on .waves { animation: hgb-twinkle 1.6s ease-in-out infinite; }
.bold.animate .tile.on .flame { animation: hgb-flicker 1.4s ease-in-out infinite; transform-origin: 12px 21px; transform-box: view-box; }
.bold.animate .tile.on .bob { animation: hgb-bob 2.6s ease-in-out infinite; }
.bold.animate .tile.moving .fill { animation: hgb-fade 2.4s ease-in-out infinite; }
@keyframes hgb-glow { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.32; } }
@keyframes hgb-twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
@keyframes hgb-rise { 0% { opacity: 0; transform: translateY(3px); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
@keyframes hgb-blink { 0%, 100% { fill: transparent; } 50% { fill: currentColor; } }
@keyframes hgb-spin { to { transform: rotate(360deg); } }
@keyframes hgb-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes hgb-flick { 0%, 100% { fill: transparent; } 50% { fill: color-mix(in srgb, currentColor 18%, transparent); } }
@keyframes hgb-flicker { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(0.96, 1.05); } 60% { transform: scale(1.03, 0.96); } }
@keyframes hgb-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
@keyframes hgb-fade { 50% { opacity: 0.7; } }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  var config = window.__HA_PANEL__ || {};
  var preview = !!config.preview;
  var recipe = config.recipe || null;
  var pluginId = config.pluginId || null;
  var params = new URLSearchParams(location.search);
  var device = params.get('device') || null;

      if (st.state !== 'off') classes.push('on');
      return '<div class="' + classes.join(' ') + '"' + data + '>' + F(head
        + '<div><div class="big">' + (a.current_temperature != null ? esc(a.current_temperature) + esc(unit) : '—') + '</div>'
        + '<div class="name">' + esc(name) + '</div>'
        + '<div class="sub">' + esc(stateText(id, st)) + (target != null ? ' · ' + esc(T.target) + ' ' + esc(target) + esc(unit) : '') + '</div></div>'
        + controls, 'rich') + hint + '</div>';
    }

    if (kind === 'media') {
      var ma = st.attributes;
      var mediaButtons = '';
      if (operable) {
        if (has(st, 16)) mediaButtons += '<button type="button" class="btn" data-action="previous" aria-label="previous">⏮</button>';
        if (has(st, 1) || has(st, 16384)) mediaButtons += '<button type="button" class="btn primary" data-action="play_pause" aria-label="' + esc(st.state === 'playing' ? T.paused : T.playing) + '">' + (st.state === 'playing' ? '⏸' : '▶') + '</button>';
        if (has(st, 32)) mediaButtons += '<button type="button" class="btn" data-action="next" aria-label="next">⏭</button>';
      }
      var volume = operable && has(st, 4) && ma.volume_level != null
        ? '<input type="range" min="0" max="100" step="5" value="' + Math.round(ma.volume_level * 100) + '" data-range="volume" aria-label="' + esc(name) + ' volume">'
        : '';
      return '<div class="' + classes.join(' ') + '"' + data + '>' + F(head + label + (mediaButtons ? '<div class="row">' + mediaButtons + '</div>' : '') + volume, 'rich') + hint + '</div>';
    }

    if (kind === 'vacuum') {
      var vacuumButtons = '';
      if (operable) {
        if (st.state !== 'cleaning' && has(st, 8192)) vacuumButtons += '<button type="button" class="btn primary" data-action="start">' + esc(T.start) + '</button>';
        if (st.state === 'cleaning' && has(st, 4)) vacuumButtons += '<button type="button" class="btn" data-action="pause">' + esc(T.pause) + '</button>';
        if (st.state !== 'docked' && has(st, 16)) vacuumButtons += '<button type="button" class="btn" data-action="dock">' + esc(T.dock) + '</button>';
      }
      if (on) classes.push('on');
      return '<div class="' + classes.join(' ') + '"' + data + '>' + F(head + label + (vacuumButtons ? '<div class="row">' + vacuumButtons + '</div>' : ''), 'rich') + hint + '</div>';
    }

    if (kind === 'select') {
      if (operable) classes.push('act');
      return '<div class="' + classes.join(' ') + '"' + data + focus + ' role="button" aria-haspopup="listbox"' + (operable ? ' tabindex="0" data-pick="select"' : '') + '>' + F(head
        + '<div><div class="name">' + esc(name) + '</div><div class="big"' + (bold ? '' : ' style="font-size:clamp(.9rem,4.5vmin,1.3rem)"') + '>' + esc(st.state) + '</div></div>', 'rich') + hint + '</div>';
    }

    if (kind === 'number') {
      var na = st.attributes;
      var numberControls = operable
        ? '<input type="range" min="' + esc(na.min) + '" max="' + esc(na.max) + '" step="' + esc(na.step || 1) + '" value="' + esc(st.state) + '" data-range="set" aria-label="' + esc(name) + '">'
        : '';
      return '<div class="' + classes.join(' ') + '"' + data + '>' + F(head + '<div><div class="big">' + esc(stateText(id, st)) + '</div><div class="name">' + esc(name) + '</div></div>' + numberControls, 'rich') + hint + '</div>';
    }

    if (kind === 'camera') {
      classes.push('camera');
      var src = preview ? '' : '/api/plugin/v1/ha/' + encodeURIComponent(pluginId) + '/camera/' + encodeURIComponent(id);
      return '<div class="' + classes.join(' ') + '"' + data + '>' + (src ? '<img class="cam" alt="" data-cam="' + esc(src) + '">' : '<div class="top"><span class="ico">' + svg(ICONS.camera) + '</span></div>')
        + '<div class="name">' + esc(name) + '</div></div>';
    }

    // Sensors and other read-only things: the value, large.
    if (domainOf(id) === 'binary_sensor' && st.state === 'on') classes.push('on');
    return '<div class="' + classes.join(' ') + '"' + data + '>' + F(head
      + '<div><div class="big">' + esc(stateText(id, st)) + '</div><div class="name">' + esc(name) + '</div></div>') + '</div>';
  }

  // Bold dimmers and shades: the fill (brightness from the bottom; a shade's
  // closed part from the top), the face, and a copy of the face in the "on"
  // text color that shows only where the fill covers it.
  function boldLevelTile(tile, id, st, kind, classes, name, head, label, hint, operable, on, focus, data) {
    var shade = kind !== 'dimmer';
    var lvl = level(id, st);
    var moving = st.state === 'opening' || st.state === 'closing';
    // How much of the tile the fill covers.
    var covered = shade
      ? (kind === 'cover' ? (st.state === 'closed' || st.state === 'opening' ? 100 : 0) : 100 - lvl)
      : lvl;
    classes.push('leveled');
    if (on) classes.push('on');
    if (shade) classes.push('down');
    if (moving) classes.push('moving');
    if (operable) classes.push('act');
    var dir = moving ? ' data-dir="' + (st.state === 'opening' ? 'up' : 'down') + '"' : '';
    var style = '--fl:' + covered + '%';
    // A fan's blades turn faster the faster it runs.
    if (domainOf(id) === 'fan' && on) style += ';--spin:' + (2.6 - 2 * lvl / 100).toFixed(2) + 's';
    var chevrons = shade && operable ? CHEVRON_UP + CHEVRON_DOWN : '';
    var face = chevrons + head + label + '<div class="pct" aria-hidden="true"></div>';
    var faces = '<div class="face passive">' + face + '</div><div class="face passive lit" aria-hidden="true">' + face + '</div>';
    var fill = '<div class="fill' + (shade ? ' down' : '') + '"></div>';
    var common = data + ' style="' + style + '" data-fl="' + covered + '"' + dir;

    if (kind === 'cover') {
      // No position: tap the top half to open, the bottom half to close.
      var halves = operable
        ? '<div class="halves">' + (moving && has(st, 8)
          ? '<button type="button" style="grid-row:span 2" data-action="stop"' + focus + ' aria-label="' + esc(name) + ': ' + esc(T.stopped) + '"></button>'
          : '<button type="button" data-action="open"' + focus + ' aria-label="' + esc(name) + ': ' + esc(T.open) + '"></button><button type="button" data-action="close" aria-label="' + esc(name) + ': ' + esc(T.closed) + '"></button>') + '</div>'
        : '';
      return '<div class="' + classes.join(' ') + '"' + common + '>' + fill + faces + halves + hint + '</div>';
    }
    classes.push('slide');
    return '<div class="' + classes.join(' ') + '"' + common + focus + ' role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + lvl + '"'
      + ' aria-label="' + esc(name) + '"' + (operable ? ' tabindex="0" data-slider="' + (shade ? 'position' : (domainOf(id) === 'fan' ? 'percentage' : 'brightness')) + '"' : ' aria-disabled="true"')
      + '>' + fill + faces + hint + '</div>';
  }

  // Camera snapshots: a fresh one every 10 seconds while the panel is seen.
  var cameraStamp = Date.now();
  function loadCameras() {
    app.querySelectorAll('img[data-cam]').forEach(function (img) {
      img.src = img.getAttribute('data-cam') + '?t=' + cameraStamp;
    });
  }
  setInterval(function () {
    if (document.hidden || preview) return;
    cameraStamp = Date.now();
    loadCameras();
  }, 10000);

  // --- Touch, mouse and keyboard --------------------------------------------------

  var tileById = function (tileId) {
    for (var i = 0; i < recipe.tiles.length; i += 1) if (recipe.tiles[i].id === tileId) return recipe.tiles[i];
    return null;
  };

  function optimisticFor(action) {
    if (action === 'toggle') {
      return function (id) {
        var st = states[id];
        if (!st) return {};
        var domain = domainOf(id);
        if (domain === 'cover') return { state: st.state === 'open' ? 'closing' : 'opening' };
        return { state: st.state === 'on' ? 'off' : 'on' };
      };
    }
    return null;
  }

  function perform(tile, action, value) {
    // A fan's speed tap: a percentage, or off after its highest speed.
    if (action === 'speed') {
      if (!value) return act(tile, 'turn_off', undefined, { optimistic: function () { return { state: 'off' }; } });
      return act(tile, 'percentage', value, { optimistic: function () { return { state: 'on', attributes: { percentage: value } }; } });
    }
    var opt = optimisticFor(action);
    return act(tile, action, value, opt ? { optimistic: opt } : null);
  }

  // Press and hold: a tile that needs it starts a ring on press and acts when
  // it completes; letting go early cancels. From the keyboard, a second press
  // within three seconds confirms.
  var holdTimer = null;
  var holdEl = null;
  function startHold(el, tile, action, value) {
    cancelHold();
    holdEl = el;
    el.style.setProperty('--hold-ms', HOLD_MS + 'ms');
    el.classList.add('holding');
    holdTimer = setTimeout(function () {
      el.classList.remove('holding');
      holdTimer = null;
      holdEl = null;
      perform(tile, action, value);
    }, HOLD_MS);
  }
  function cancelHold() {
    if (holdTimer) clearTimeout(holdTimer);
    holdTimer = null;
    if (holdEl) holdEl.classList.remove('holding');
    holdEl = null;
  }

  function trigger(target, viaKeyboard, pointerEvent) {
    var tileEl = target.closest('[data-tile]');
    if (!tileEl) return;
    var tile = tileById(tileEl.getAttribute('data-tile'));
    if (!tile) return;
    var st = stateOf(tile.entities[0]);
    var pick = target.closest('[data-pick]');
    if (pick) {
      openPicker(tile, st, pick.getAttribute('data-pick'));
      return;
    }
    var actionEl = target.closest('[data-action]');
    if (!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    var valueAttr = actionEl.getAttribute('data-value');
    var value = valueAttr == null ? undefined : Number(valueAttr);
    if (needsHold(tile, st)) {
      if (viaKeyboard) {
        if (holdArmed[tile.id] && Date.now() - holdArmed[tile.id] < 3000) {
          delete holdArmed[tile.id];
          perform(tile, action, value);
        } else {
          holdArmed[tile.id] = Date.now();
          flashHint(tile, T.holdKey);
        }
        return;
      }
      if (pointerEvent) startHold(tileEl, tile, action, value);
      return;
    }
    if (action === 'run') {
      tileEl.classList.add('flash');
      setTimeout(function () { tileEl.classList.remove('flash'); }, 450);
    }
    perform(tile, action, value);
  }

  // Sliders: a vertical drag on a dimmer or shade sets its level. A short tap
  // without movement toggles instead (opens or closes, for a shade).
  var dragging = null;
  app.addEventListener('pointerdown', function (event) {
    var slider = event.target.closest('[data-slider]');
    if (slider && !event.target.closest('button')) {
      var tile = tileById(slider.closest('[data-tile]').getAttribute('data-tile'));
      dragging = { el: slider, tile: tile, kind: slider.getAttribute('data-slider'), startY: event.clientY, startX: event.clientX, moved: false, pointerId: event.pointerId, value: null };
      try { slider.setPointerCapture(event.pointerId); } catch (e) { /* not capturable */ }
      return;
    }
    var holdTarget = event.target.closest('[data-action]');
    if (holdTarget) {
      var tileEl = holdTarget.closest('[data-tile]');
      var t = tileEl && tileById(tileEl.getAttribute('data-tile'));
      if (t && needsHold(t, stateOf(t.entities[0]))) {
        event.preventDefault();
        trigger(event.target, false, true);
      }
    }
  });
  app.addEventListener('pointermove', function (event) {
    if (!dragging || event.pointerId !== dragging.pointerId) return;
    var dy = event.clientY - dragging.startY;
    if (!dragging.moved && Math.abs(dy) < 8) return;
    dragging.moved = true;
    var rect = dragging.el.getBoundingClientRect();
    var fromBottom = 1 - (event.clientY - rect.top) / rect.height;
    var pct = Math.round(Math.max(0, Math.min(1, fromBottom)) * 100);
    dragging.value = pct;
    var fill = dragging.el.querySelector('.fill');
    if (dragging.el.hasAttribute('data-fl')) {
      // Bold: the fill and the lit words follow the finger, and the level
      // shows large.
      var isShade = dragging.kind === 'position';
      dragging.el.classList.add('sliding');
      dragging.el.style.transition = 'none';
      dragging.el.style.setProperty('--fl', (isShade ? 100 - pct : pct) + '%');
      var big = pct + '%' + (isShade ? '<small>' + esc(T.open) + '</small>' : '');
      dragging.el.querySelectorAll('.pct').forEach(function (el) { el.innerHTML = big; });
    } else if (fill) {
      var shown = dragging.kind === 'position' ? 100 - pct : pct;
      fill.style.height = shown + '%';
      fill.style.setProperty('--lvl', shown + '%');
    }
    dragging.el.setAttribute('aria-valuenow', String(pct));
  });
  function endDrag(event) {
    if (!dragging || (event && event.pointerId !== dragging.pointerId)) return;
    var d = dragging;
    dragging = null;
    // Draw the tile afresh, whatever comes back: the drag changed it by hand.
    redrawTile(d.tile.id);
    if (d.moved && d.value !== null) {
      var patch = d.kind === 'position'
        ? { attributes: { current_position: d.value }, state: d.value > 0 ? 'open' : 'closed' }
        : d.kind === 'percentage'
          ? { attributes: { percentage: d.value }, state: d.value > 0 ? 'on' : 'off' }
          : { attributes: { brightness: Math.round(d.value * 2.55) }, state: d.value > 0 ? 'on' : 'off' };
      act(d.tile, d.kind, d.value, { optimistic: function () { return patch; } });
    } else if (event && event.type === 'pointerup') {
      var st = stateOf(d.tile.entities[0]);
      if (d.kind === 'position') {
        var rect = d.el.getBoundingClientRect();
        perform(d.tile, event.clientY - rect.top < rect.height / 2 ? 'open' : 'close');
      } else if (needsHold(d.tile, st)) {
        flashHint(d.tile, T.hold);
      } else {
        perform(d.tile, 'toggle');
      }
    }
    render();
  }
  app.addEventListener('pointerup', function (event) {
    if (dragging) { endDrag(event); return; }
    cancelHold();
  });
  app.addEventListener('pointercancel', function (event) {
    if (dragging) { redrawTile(dragging.tile.id); dragging = null; render(); return; }
    cancelHold();
  });
  app.addEventListener('pointerleave', cancelHold);

  app.addEventListener('click', function (event) {
    if (event.target.closest('[data-slider]') || event.target.closest('input')) return;
    var actionEl = event.target.closest('[data-action],[data-pick]');
    if (!actionEl) return;
    var tileEl = actionEl.closest('[data-tile]');
    var tile = tileEl && tileById(tileEl.getAttribute('data-tile'));
    // Held actions run from pointerdown; a click (from the keyboard) confirms.
    if (tile && needsHold(tile, stateOf(tile.entities[0])) && actionEl.hasAttribute('data-action')) {
      if (event.detail === 0) trigger(event.target, true, false);
      return;
    }
    trigger(event.target, false, false);
  });

  app.addEventListener('keydown', function (event) {
    var el = event.target;
    if (el.hasAttribute && el.hasAttribute('data-slider') && (event.key === 'ArrowUp' || event.key === 'ArrowDown' || event.key === 'ArrowRight' || event.key === 'ArrowLeft')) {
      event.preventDefault();
      var tile = tileById(el.closest('[data-tile]').getAttribute('data-tile'));
      var now = Number(el.getAttribute('aria-valuenow')) || 0;
      var kind = el.getAttribute('data-slider');
      var up = event.key === 'ArrowUp' || event.key === 'ArrowRight';
      var next = Math.max(0, Math.min(100, now + (up ? 10 : -10)));
      act(tile, kind, next);
      return;
    }
    if ((event.key === 'Enter' || event.key === ' ') && el.hasAttribute && (el.hasAttribute('data-action') || el.hasAttribute('data-pick') || el.hasAttribute('data-slider'))) {
      if (el.tagName === 'BUTTON') return; // the click handler has it
      event.preventDefault();
      if (el.hasAttribute('data-slider')) {
        var sliderTile = tileById(el.closest('[data-tile]').getAttribute('data-tile'));
        perform(sliderTile, 'toggle');
        return;
      }
      trigger(el, true, false);
    }
  });

  app.addEventListener('change', function (event) {
    var input = event.target.closest('[data-range]');
    if (!input) return;
    var tile = tileById(input.closest('[data-tile]').getAttribute('data-tile'));
    act(tile, input.getAttribute('data-range'), Number(input.value));
  });

  // --- Overlays ------------------------------------------------------------------

  function overlay(html, onMount) {
    var el = document.createElement('div');
    el.className = 'overlay';
    el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(el);
    var close = function () { el.remove(); };
    el.addEventListener('click', function (event) { if (event.target === el) close(); });
    el.addEventListener('keydown', function (event) { if (event.key === 'Escape') close(); });
    onMount(el, close);
    return close;
  }

  function askPin(error, done) {
    var pin = '';
    overlay(
      '<h2>' + esc(T.pinTitle) + '</h2><div class="dots" aria-hidden="true"></div>'
      + '<input type="password" inputmode="numeric" autocomplete="off" aria-label="' + esc(T.pinTitle) + '" style="position:absolute;opacity:0;width:1px;height:1px">'
      + '<div class="err" role="alert">' + esc(error || '') + '</div><div class="keys">'
      + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button type="button" class="btn" data-key="' + n + '">' + n + '</button>'; }).join('')
      + '<button type="button" class="btn" data-key="clear">' + esc(T.clearKey) + '</button><button type="button" class="btn" data-key="0">0</button>'
      + '<button type="button" class="btn primary" data-key="ok">' + esc(T.ok) + '</button></div>'
      + '<button type="button" class="btn" data-key="cancel">' + esc(T.cancel) + '</button>',
      function (el, close) {
        var dots = el.querySelector('.dots');
        var input = el.querySelector('input');
        var show = function () { dots.innerHTML = new Array(pin.length + 1).join('<span></span>'); };
        var submit = function () {
          if (!pin) return;
          close();
          done(pin);
        };
        input.addEventListener('input', function () { pin = input.value; show(); });
        input.addEventListener('keydown', function (event) { if (event.key === 'Enter') submit(); });
        el.addEventListener('click', function (event) {
          var key = event.target.closest('[data-key]');
          if (!key) return;
          var k = key.getAttribute('data-key');
          if (k === 'cancel') close();
          else if (k === 'ok') submit();
          else if (k === 'clear') { pin = ''; input.value = ''; show(); }
          else if (pin.length < 12) { pin += k; input.value = pin; show(); }
        });
        input.focus();
      }
    );
  }

  function openPicker(tile, st, which) {
    if (!st) return;
    if (preview) { flashHint(tile, T.previewNoActions); return; }
    var options = which === 'hvac_mode' ? (st.attributes.hvac_modes || []) : (st.attributes.options || []);
    var current = which === 'hvac_mode' ? st.state : st.state;
    var label = function (option) {
      if (which !== 'hvac_mode') return option;
      return T[option === 'off' ? 'off_mode' : option === 'dry' ? 'dry_mode' : option] || option;
    };
    overlay(
      '<h2>' + esc(tileName(tile, st)) + '</h2><div class="opts" role="listbox">'
      + options.map(function (option) {
        return '<button type="button" role="option" class="btn' + (option === current ? ' current' : '') + '" aria-selected="' + (option === current) + '" data-option="' + esc(option) + '">' + esc(label(option)) + '</button>';
      }).join('') + '</div><button type="button" class="btn" data-option-cancel>' + esc(T.cancel) + '</button>',
      function (el, close) {
        el.addEventListener('click', function (event) {
          if (event.target.closest('[data-option-cancel]')) { close(); return; }
          var opt = event.target.closest('[data-option]');
          if (!opt) return;
          close();
          act(tile, which === 'hvac_mode' ? 'hvac_mode' : 'select', opt.getAttribute('data-option'));
        });
        var first = el.querySelector('.current') || el.querySelector('[data-option]');
        if (first) first.focus();
      }
    );
  }

  // --- Running --------------------------------------------------------------------

  // The builder's preview sends the recipe it is editing.
  window.addEventListener('message', function (event) {
    if (!preview || event.source !== window.parent) return;
    var data = event.data;
    if (!data || data.type !== 'homeglow:ha-preview' || !data.recipe) return;
    recipe = data.recipe;
    render();
    poll();
  });

  // A nudge from HomeGlow that something changed: read again at once.
  var nudge = null;
  if (window.HomeGlow && !preview) {
    window.HomeGlow.on('ha.state', function (payload) {
      var ids = (payload && payload.entityIds) || [];
      var mine = entitiesWanted();
      if (!ids.some(function (id) { return mine.indexOf(id) !== -1; })) return;
      clearTimeout(nudge);
      nudge = setTimeout(poll, 150);
    });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  window.addEventListener('resize', function () { render(); });
  setInterval(poll, POLL_MS);
  render();
  poll();
})();
</script>
</body>
</html>
