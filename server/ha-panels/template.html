<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Assistant panel</title>
<!-- HA_PANEL_CONFIG -->
<script src="/plugin-sdk/v1.js"></script>
<style>
/* Home Assistant panel (issue #252): one template draws every panel from its
   recipe. Colors, radii, type and levels come from the theme's role tokens
   (the SDK writes them onto :root), each with a fallback. */
:root {
  --acc: var(--accent, #3a7cc4);
  --ink: var(--text, #1e2b3a);
  --ink-2: var(--text-secondary, #5a6b7d);
  --on-bg: var(--hg-button-bg, var(--acc));
  --on-ink: var(--hg-button-text, #ffffff);
  --level: var(--hg-meter-fill, var(--acc));
  --level-track: var(--hg-meter-track, rgba(127, 127, 127, 0.18));
  --tile-bg: color-mix(in srgb, var(--ink) 6%, transparent);
  --tile-radius: var(--hg-radius-md, 14px);
  --warn: var(--warning, #c9822b);
  --err: var(--hg-error, #c43d3d);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent !important; }
body {
  color: var(--ink);
  font-family: var(--hg-font-body, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overflow: hidden;
}
#app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: clamp(6px, 2vmin, 12px); overflow: auto; }
.banner { margin: 0; padding: 8px 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; line-height: 1.35;
  background: color-mix(in srgb, var(--warn) 16%, transparent); }
.banner.error { background: color-mix(in srgb, var(--err) 14%, transparent); }
.grid { display: grid; gap: clamp(6px, 1.8vmin, 10px); grid-auto-flow: dense;
  grid-template-columns: repeat(var(--cols, auto-fill), minmax(var(--min, clamp(86px, 24vmin, 150px)), 1fr));
  grid-auto-rows: minmax(clamp(78px, 22vmin, 140px), auto); }
.grid.fixed { --min: 0px; }
.offline .tile { opacity: 0.55; }

.tile { position: relative; overflow: hidden; min-width: 0; min-height: 0; border: 0; margin: 0; font: inherit; color: inherit;
  border-radius: var(--tile-radius); background: var(--tile-bg); padding: clamp(8px, 2.4vmin, 14px); text-align: left;
  display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background 0.2s, color 0.2s, transform 0.1s; }
.tile.w2 { grid-column: span 2; }
.tile.h2 { grid-row: span 2; }
.tile.act { cursor: pointer; }
.tile.act:active { transform: scale(0.98); }
.tile:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.tile.on { background: var(--on-bg); color: var(--on-ink); }
.tile.on .sub { color: inherit; opacity: 0.85; }
.tile.missing { opacity: 0.5; }
.tile.flash { background: var(--on-bg); color: var(--on-ink); }
.tile.slide { touch-action: none; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; position: relative; z-index: 2; }
.ico { width: clamp(22px, 7vmin, 34px); height: clamp(22px, 7vmin, 34px); flex: none; display: grid; place-items: center; font-size: clamp(18px, 6vmin, 28px); line-height: 1; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tile:not(.on) .ico svg { stroke: var(--acc); }
.name { font-weight: 650; font-size: clamp(0.78rem, 3.4vmin, 1rem); line-height: 1.2; overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; position: relative; z-index: 2; }
.sub { font-size: clamp(0.7rem, 2.8vmin, 0.85rem); color: var(--ink-2); position: relative; z-index: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big { font-size: clamp(1.1rem, 7vmin, 2rem); font-weight: 700; line-height: 1.05; position: relative; z-index: 2; }
.badge { font-size: 0.68rem; font-weight: 700; padding: 0.2em 0.6em; border-radius: 999px; background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--ink); }

/* Levels: brightness and fan speed fill from the bottom, a shade's closed
   part from the top. Drawn in the theme's meter color. */
.fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--level); opacity: 0.85; transition: height 0.2s; z-index: 1; }
.fill.down { top: 0; bottom: auto; }
.tile.leveled { background: var(--tile-bg); color: var(--ink); }
.tile.leveled.on .sub { color: var(--ink-2); }

.row { display: flex; gap: 6px; flex-wrap: wrap; position: relative; z-index: 2; }
.btn { appearance: none; border: 0; font: inherit; font-weight: 650; font-size: clamp(0.72rem, 2.8vmin, 0.9rem); cursor: pointer;
  min-height: 36px; min-width: 36px; padding: 0 0.8em; border-radius: var(--hg-button-radius, 999px); position: relative;
  background: color-mix(in srgb, var(--acc) 14%, transparent); color: inherit;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: transform 0.12s ease, background-color 0.2s, color 0.2s; }
.btn:active:not([disabled]) { transform: scale(0.88); }
/* Sent, waiting for the player: a ring turns around the button. */
.btn.busy::after { content: ''; position: absolute; inset: -5px; border-radius: inherit; border: 3px solid transparent;
  border-top-color: var(--acc); border-right-color: var(--acc); animation: hg-spin 0.9s linear infinite; pointer-events: none; }
@keyframes hg-spin { to { transform: rotate(360deg); } }
.btn:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.btn.primary { background: var(--on-bg); color: var(--on-ink); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.halves { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr 1fr; z-index: 3; }
.halves button { appearance: none; border: 0; background: transparent; cursor: pointer; color: transparent; }
.halves button:focus-visible { outline: 3px solid var(--acc); outline-offset: -3px; border-radius: var(--tile-radius); }
.chev { position: absolute; left: 50%; transform: translateX(-50%); width: 18px; height: 18px; opacity: 0.6; z-index: 2; }
.chev.up { top: 6px; } .chev.down { bottom: 6px; }
input[type=range] { width: 100%; accent-color: var(--level); position: relative; z-index: 2; }
.cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; border-radius: var(--tile-radius); }
.tile.camera { padding: 0; justify-content: flex-end; }
.tile.camera .name { padding: 6px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.55)); color: #fff; }

/* Press and hold: a ring fills while held. */
.ring { position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; z-index: 4; opacity: 0; transition: opacity 0.1s; }
.ring circle { fill: none; stroke: var(--acc); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 69.1; stroke-dashoffset: 69.1; }
.tile.on .ring circle { stroke: var(--on-ink); }
.holding .ring { opacity: 1; }
.holding .ring circle { transition: stroke-dashoffset var(--hold-ms, 650ms) linear; stroke-dashoffset: 0; }
.hint { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 5; font-size: 0.72rem; font-weight: 650; text-align: center;
  padding: 4px 6px; border-radius: 8px; background: color-mix(in srgb, var(--ink) 80%, transparent); color: var(--background, #fff); }

/* Music: a media player tile shows what's playing, with its picture, and
   opens the player's library (browse, search, recent searches). */
.np { display: flex; align-items: center; gap: clamp(8px, 2.4vmin, 14px); min-width: 0; position: relative; z-index: 2; }
.np .art { width: clamp(52px, 17vmin, 112px); aspect-ratio: 1; flex: none; border-radius: var(--hg-radius-sm, 10px); object-fit: cover;
  background: color-mix(in srgb, var(--acc) 12%, transparent); display: grid; place-items: center; }
.tile.h2 .np .art { width: clamp(72px, 26vmin, 168px); }
.np .art svg { width: 46%; height: 46%; fill: none; stroke: var(--acc); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.art.gone { visibility: hidden; }
.np .meta { min-width: 0; flex: 1; }
.np .title { font-weight: 700; font-size: clamp(0.9rem, 4vmin, 1.25rem); line-height: 1.2; overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.np .sub + .sub { opacity: 0.8; }
.ctl { justify-content: center; align-items: center; gap: clamp(4px, 1.6vmin, 10px); flex-wrap: nowrap; }
.btn.icon { padding: 0; width: clamp(36px, 10vmin, 52px); height: clamp(36px, 10vmin, 52px); display: grid; place-items: center; flex: none; }
.btn.icon.lg { width: clamp(44px, 13vmin, 64px); height: clamp(44px, 13vmin, 64px); }
.btn.icon svg { width: 52%; height: 52%; fill: currentColor; }
.btn.icon.toggled { background: var(--on-bg); color: var(--on-ink); }
.btn.icon.quiet { background: transparent; }
.btn.icon.quiet:active:not([disabled]) { background: color-mix(in srgb, var(--acc) 20%, transparent); }
.ctl.tight { flex-wrap: wrap; gap: 2px; }
.ctl.tight .btn.icon { width: clamp(32px, 9vmin, 44px); height: clamp(32px, 9vmin, 44px); }
.list .tile .np .art { width: 36px; }
.skipping .title, .skipping .artist, .skipping .album, .skipping .np .sub { opacity: 0.4; transition: opacity 0.2s; }

/* Where the song is. A tap on the bar jumps there, when the player can. */
.prog { width: 100%; position: relative; z-index: 2; }
.prog .bar { position: relative; height: 22px; display: flex; align-items: center; }
.prog .bar[data-seek] { cursor: pointer; touch-action: none; }
.prog .bar::before { content: ''; position: absolute; left: 0; right: 0; height: 5px; border-radius: 999px; background: var(--level-track); }
.prog .done { position: absolute; left: 0; width: 0; height: 5px; border-radius: 999px; background: var(--acc); }
.prog .bar[data-seek] .done::after { content: ''; position: absolute; right: -7px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
  border-radius: 50%; background: var(--acc); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
.prog .bar:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; border-radius: 6px; }
.prog .times { display: flex; justify-content: space-between; margin-top: -2px; font-size: clamp(0.68rem, 2.4vmin, 0.85rem);
  color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Volume: the theme's level colors, a round thumb big enough for a finger. */
.vol { display: flex; align-items: center; gap: 10px; width: 100%; position: relative; z-index: 2; }
.vol svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--ink-2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
input[type=range].level { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; width: auto; height: 30px; margin: 0;
  background: transparent; cursor: pointer; --pct: 50%; }
input.level::-webkit-slider-runnable-track { height: 6px; border-radius: 999px;
  background: linear-gradient(to right, var(--level) 0 var(--pct), var(--level-track) var(--pct) 100%); }
input.level::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%;
  background: var(--surface, #fff); border: 3px solid var(--level); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
input.level::-moz-range-track { height: 6px; border-radius: 999px; background: var(--level-track); }
input.level::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--level); }
input.level::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--surface, #fff); border: 3px solid var(--level); }
input.level:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; border-radius: 8px; }

/* A panel that is just one music player: the whole panel is the player.
   The record sleeve is the big thing; the rest stays quiet. Its picture,
   blurred, tints the background; a veil in the theme's surface color keeps
   the words readable in light and dark themes. */
.grid.solo { flex: 1 1 auto; min-height: 0; grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); }
.grid.solo > .tile { grid-column: auto; grid-row: auto; }
.tile.stage { display: block; padding: 0; container-type: size; isolation: isolate; }
.stage .backdrop { position: absolute; inset: -15%; width: 130%; height: 130%; object-fit: cover; z-index: 0; pointer-events: none;
  filter: blur(46px) saturate(1.3); opacity: 0.55; }
.tile.stage::after { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(100deg, color-mix(in srgb, var(--surface, #fff) 18%, transparent), color-mix(in srgb, var(--surface, #fff) 74%, transparent) 58%); }
.stage-in { --pad: clamp(14px, 5cqmin, 44px); position: relative; z-index: 1; height: 100%; padding: var(--pad);
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: clamp(14px, 5cqmin, 52px); }
.sleeve { height: min(calc(100cqh - 2 * var(--pad)), 46cqw); aspect-ratio: 1; border-radius: var(--hg-radius-md, 14px); overflow: hidden;
  display: grid; place-items: center; background: color-mix(in srgb, var(--acc) 14%, var(--surface, #fff));
  box-shadow: 0 22px 48px -18px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.12); }
.sleeve img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sleeve > svg { width: 36%; height: 36%; fill: none; stroke: var(--acc); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.stage .info { min-width: 0; display: flex; flex-direction: column; gap: clamp(4px, 1.4cqmin, 12px); }
.stage .who { display: flex; align-items: center; gap: 0.45em; min-width: 0; color: var(--ink-2); font-weight: 600;
  font-size: clamp(0.74rem, 2.3cqmin, 1rem); }
.stage .who svg { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.stage .who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage .title { font-size: clamp(1.2rem, 6.4cqmin, 3.4rem); font-weight: 760; line-height: 1.06; letter-spacing: -0.015em; text-wrap: balance;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.stage .artist { font-size: clamp(0.95rem, 3.4cqmin, 1.65rem); font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage .album { font-size: clamp(0.8rem, 2.6cqmin, 1.2rem); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage .prog { margin-top: clamp(4px, 2cqmin, 18px); }
.stage .prog .times { font-size: clamp(0.72rem, 2.2cqmin, 1rem); }
.stage .ctl { justify-content: flex-start; gap: clamp(6px, 2.6cqmin, 24px); margin-top: clamp(0px, 1cqmin, 8px); }
.stage .btn.icon { width: clamp(40px, 9.5cqmin, 76px); height: clamp(40px, 9.5cqmin, 76px); }
.stage .btn.icon.lg { width: clamp(54px, 15cqmin, 112px); height: clamp(54px, 15cqmin, 112px); }
.stage .btn.icon.lg svg { width: 44%; height: 44%; }
.stage .vol { max-width: 440px; margin-top: clamp(2px, 1.4cqmin, 12px); }
.stage .btn.choose { align-self: flex-start; min-height: 48px; padding: 0 1.2em; display: inline-flex; align-items: center; gap: 0.5em;
  font-size: clamp(0.9rem, 3cqmin, 1.2rem); margin-top: clamp(6px, 2cqmin, 16px); }
.stage .btn.choose svg { width: 1.2em; height: 1.2em; fill: currentColor; }
/* Taller than wide: the sleeve on top, everything centered under it. */
@container (max-aspect-ratio: 6/5) {
  .stage-in { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; justify-items: center; text-align: center; }
  .sleeve { height: auto; max-height: 100%; width: min(76cqw, 46cqh); }
  .stage .info { align-items: center; width: 100%; max-width: 560px; }
  .stage .ctl { justify-content: center; }
  .stage .btn.choose { align-self: center; }
  .tile.stage::after { background: linear-gradient(180deg, color-mix(in srgb, var(--surface, #fff) 18%, transparent), color-mix(in srgb, var(--surface, #fff) 76%, transparent) 52%); }
}
/* A short panel: fewer lines. */
@container (max-height: 340px) {
  .stage .album, .stage .who { display: none; }
}
@container (max-height: 230px) {
  .stage .vol, .stage .prog .times { display: none; }
}

.sheet.library { width: min(640px, 100%); height: min(100%, 780px); padding: 12px; gap: 8px; }
.lib-head { display: flex; align-items: center; gap: 6px; }
.lib-head h2 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--tile-bg); }
.tabs .btn { flex: 1; background: transparent; }
.tabs .btn.current { background: var(--on-bg); color: var(--on-ink); }
.lib-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
.item { appearance: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%;
  display: flex; align-items: center; gap: 10px; padding: 6px; min-height: 56px; border-radius: 10px; background: transparent; }
.item:hover, .item:focus-visible { background: var(--tile-bg); }
.item:focus-visible { outline: 3px solid var(--acc); outline-offset: -3px; }
.item .thumb { width: 44px; height: 44px; flex: none; border-radius: 6px; object-fit: cover; background: var(--tile-bg); display: grid; place-items: center; }
.item .thumb svg { width: 55%; height: 55%; fill: none; stroke: var(--acc); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.item .t { flex: 1; min-width: 0; }
.item .t b { display: block; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .t span { display: block; font-size: 0.78rem; color: var(--ink-2); }
.item .go { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; }
.item .go svg { width: 50%; height: 50%; fill: currentColor; }
.item .go.play { background: var(--on-bg); color: var(--on-ink); }
.lib-search { display: flex; gap: 6px; }
.lib-search input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 10px; font: inherit; font-size: 1rem;
  border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); background: var(--background, #fff); color: var(--ink);
  -webkit-user-select: text; user-select: text; }
.lib-search input:focus-visible { outline: 3px solid var(--acc); outline-offset: 1px; }
.lib-label { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; font-weight: 650; color: var(--ink-2); margin: 6px 2px 2px; }
.lib-label .btn { min-height: 30px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .btn { min-height: 40px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-status { padding: 14px 6px; text-align: center; color: var(--ink-2); font-size: 0.9rem; }
.lib-status.err { color: var(--err); }

/* Small widgets: a compact list. */
.list { display: flex; flex-direction: column; gap: 6px; }
.list .tile { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; min-height: 48px; padding: 6px 10px; }
.list .tile > div:not(.top):not(.fill):not(.halves):not(.hint) { flex: 1; min-width: 0; }
.list .tile .row { flex: none; }
.list .tile .top { align-items: center; }
.list .tile .big { font-size: 1rem; }
.list .tile .fill { left: 0; top: 0; bottom: 0; height: auto !important; width: var(--lvl, 0%); right: auto; }
.list .tile .fill.down { width: var(--lvl, 0%); }

/* Overlays: the PIN pad and option lists. */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 10px;
  background: color-mix(in srgb, var(--background, #000) 72%, transparent); }
.sheet { width: min(320px, 100%); max-height: 100%; overflow: auto; border-radius: var(--hg-radius-lg, 18px); padding: 14px;
  background: var(--surface, #fff); color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 10px; }
.sheet h2 { margin: 0; font-size: 1rem; }
.dots { display: flex; gap: 8px; justify-content: center; min-height: 14px; }
.dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--acc); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keys .btn { min-height: 48px; font-size: 1.1rem; }
.err { color: var(--err); font-size: 0.85rem; font-weight: 600; text-align: center; min-height: 1.2em; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opts .btn { min-height: 44px; text-align: left; border-radius: 10px; }
.opts .btn.current { background: var(--on-bg); color: var(--on-ink); }
.empty { margin: auto; text-align: center; color: var(--ink-2); font-size: 0.9rem; }
/* A short widget: a tighter PIN pad, so it fits. */
@media (max-height: 460px) {
  .overlay { padding: 4px; }
  .sheet { padding: 10px; gap: 6px; }
  .keys { gap: 5px; }
  .keys .btn { min-height: 34px; font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  var config = window.__HA_PANEL__ || {};
  var preview = !!config.preview;
  var recipe = config.recipe || null;
  var pluginId = config.pluginId || null;
  var params = new URLSearchParams(location.search);
  var device = params.get('device') || null;
  var hidden = (params.get('hide') || '').split(',').filter(Boolean);
  var viewOnlyDisplay = hidden.indexOf('operate') !== -1;
  var lang = (params.get('lang') || navigator.language || 'en').slice(0, 2) === 'es' ? 'es' : 'en';

  var POLL_MS = 2000;
  var HOLD_MS = 650;

  var STRINGS = {

  var COVER_ICONS = { garage: 'garage', gate: 'gate', door: 'door', window: 'window', blind: 'blinds', curtain: 'curtain', shutter: 'blinds', shade: 'shade' };

      climate: 'thermometer', media_player: dc === 'tv' ? 'tv' : 'speaker', lock: 'lock', alarm_control_panel: 'shield',
      vacuum: 'robot', input_select: 'gauge', select: 'gauge', input_number: 'gauge', number: 'gauge', camera: 'camera',
      sensor: SENSOR_ICONS[dc] || 'gauge', binary_sensor: SENSOR_ICONS[dc] || 'bell', person: 'home', device_tracker: 'home', sun: 'sun', weather: 'sun'

      case 'scene': case 'script': case 'button': case 'input_button': return 'run';
      case 'climate': return 'climate';
      case 'media_player': return 'media';
      case 'lock': return 'lock';
      case 'alarm_control_panel': return 'alarm';

  function level(id, st) {

    // anything under a finger, or the tap would land on a replaced button.

    var html = '';
    if (!recipe) {

    }
    if (problem) {
      var text = problem.kind === 'notConnected' ? T.notConnected : problem.kind === 'token' ? T.tokenRejected : T.unreachable;

    }

    if (!tiles.length) {

    var cols = recipe.columns && recipe.columns !== 'auto' ? Number(recipe.columns) : 0;

  function tileHtml(tile, compact, narrow) {

    }
    var name = tileName(tile, st);
    var operable = st && canOperate(tile) && st.state !== 'unavailable';
    var hold = needsHold(tile, st);
    var size = !compact && !narrow && tile.size ? tile.size : '1x1';
    var classes = ['tile'];
    if (size.charAt(0) === '2') classes.push('w2');
    if (size.charAt(2) === '2') classes.push('h2');
    if (!st) classes.push('missing');
    var on = tile.entities.some(function (e) { return isOn(e, stateOf(e)); });
    var sub = tile.showState === false ? '' : stateText(id, st);
    var hint = hints[tile.id] ? '<div class="hint" role="status">' + esc(hints[tile.id]) + '</div>' : '';
    var ring = hold && operable ? '<svg class="ring" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11"/></svg>' : '';
    var head = '<div class="top"><span class="ico">' + iconFor(tile, st) + '</span></div>';
    var label = '<div><div class="name">' + esc(name) + '</div>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>';
    var focus = ' data-focus="' + tile.id + '"';
    var data = ' data-tile="' + tile.id + '"';

        + '<div class="name">' + esc(name) + '</div>'
        + '<div class="sub">' + esc(stateText(id, st)) + (target != null ? ' · ' + esc(T.target) + ' ' + esc(target) + esc(unit) : '') + '</div></div>'

  // A media player: what's playing (with its picture, on a larger tile), where

  function mediaTileHtml(tile, st, o) {
    var id = tile.entities[0];
    var a = st.attributes || {};

    var idle = ['off', 'idle', 'standby', 'unavailable', 'unknown'].indexOf(st.state) !== -1 && !a.media_title;

    var small = !big || o.compact;

    var sk = skipping[tile.id];

      if (has(st, 1) || has(st, 16384)) {

        + controls + volume + o.hint + '</div>';

        : '';

        + (artSrc ? '<img class="art backdrop" alt="" src="' + esc(artSrc) + '">' : '')
        + '<div class="stage-in"><div class="sleeve">' + (artSrc ? '<img class="art" alt="" src="' + esc(artSrc) + '">' : svg(ICONS.music)) + '</div>'
        + '<div class="info">'
        + (tile.showState === false ? '' : '<div class="who">' + iconFor(tile, st) + '<span>' + esc(o.name) + '</span></div>')
        + '<div class="title">' + esc(title) + '</div>'
        + (!idle && a.media_artist ? '<div class="artist">' + esc(a.media_artist) + '</div>' : '')
        + (!idle && a.media_album_name ? '<div class="album">' + esc(a.media_album_name) + '</div>' : '')
        + (idle && st.state === 'unavailable' ? '<div class="album">' + esc(T.unavailable) + '</div>' : '')
        + progress + controls + choose + (idle ? '' : volume)
        + '</div></div>' + o.hint + '</div>';
    }

    var art = artSrc ? '<img class="art" alt="" src="' + esc(artSrc) + '">' : '<span class="art">' + svg(ICONS.music) + '</span>';
    var detail = [a.media_artist, a.media_album_name].filter(Boolean).join(' · ');

      + '<div class="np">' + art + '<div class="meta"><div class="title">' + esc(title) + '</div>'
      + (detail ? '<div class="sub">' + esc(detail) + '</div>' : '')
      + (tile.showState === false ? '' : '<div class="sub">' + esc(o.name) + '</div>') + '</div></div>'
      + progress + controls + volume + o.hint + '</div>';

  function canBrowse(st) {
    return !preview && has(st, MEDIA_FEATURE.PLAY_MEDIA) && (has(st, MEDIA_FEATURE.BROWSE_MEDIA) || has(st, MEDIA_FEATURE.SEARCH_MEDIA));
  }

  // On a small tile the slider goes alone: the speaker icons would squeeze it.
  function volumeHtml(tile, st, name, bare) {
    var pct = Math.round((Number(st.attributes.volume_level) || 0) * 100);

      + '<input type="range" class="level" min="0" max="100" step="2" value="' + pct + '" style="--pct:' + pct + '%" data-range="volume"'
      + ' data-focus="' + esc(tile.id) + ':volume" aria-label="' + esc(name) + ': ' + esc(T.volume) + '">'
      + (bare ? '' : svg(VOLUME_ICONS.high)) + '</div>';
  }

  // Where the song is, in seconds, now: Home Assistant reports a position and
  // when it was taken; while playing, the time since is added. Null when the
  // player doesn't say (a radio station, say).
  function positionNow(a, playing) {
    var pos = Number(a.media_position);

    }
    return Math.max(0, Math.min(dur, pos));
  }

  function clock(seconds) {
    var t = Math.max(0, Math.floor(seconds));
    var h = Math.floor(t / 3600);
    var m = Math.floor((t % 3600) / 60);
    var sec = t % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // The bar and the times; tickProgress() moves them every second, so the
  // markup itself stays the same while a song plays.
  function progressHtml(tile, st, operable) {
    var a = st.attributes || {};
    var dur = Number(a.media_duration);
    if (positionNow(a, false) === null) return '';
    var seek = operable && has(st, MEDIA_FEATURE.SEEK);
    return '<div class="prog" data-prog="' + esc(tile.id) + '">'
      + '<div class="bar"' + (seek
        ? ' data-seek role="slider" tabindex="0" data-focus="' + esc(tile.id) + ':seek" aria-label="' + esc(T.position) + '" aria-valuemin="0" aria-valuemax="' + Math.round(dur) + '"'
        : ' aria-hidden="true"')
      + '><span class="done"></span></div>'
      + '<div class="times"><span class="t-pos"></span><span>' + clock(dur) + '</span></div></div>';
  }

  function tickProgress() {
    app.querySelectorAll('[data-prog]').forEach(function (el) {
      var tile = tileById(el.getAttribute('data-prog'));
      var st = tile && stateOf(tile.entities[0]);
      if (!st) return;
      var a = st.attributes || {};
      var pos = positionNow(a, st.state === 'playing');
      if (pos === null) return;
      var done = el.querySelector('.done');
      if (done) done.style.width = (pos / Number(a.media_duration) * 100).toFixed(2) + '%';
      var shown = el.querySelector('.t-pos');
      if (shown) shown.textContent = clock(pos);
      var bar = el.querySelector('[data-seek]');
      if (bar) {
        bar.setAttribute('aria-valuenow', String(Math.round(pos)));
        bar.setAttribute('aria-valuetext', clock(pos) + ' / ' + clock(Number(a.media_duration)));
      }
    });
  }
  setInterval(function () { if (!document.hidden) tickProgress(); }, 1000);

  // Camera snapshots: a fresh one every 10 seconds while the panel is seen.
  var cameraStamp = Date.now();
  function loadCameras() {
    app.querySelectorAll('img[data-cam]').forEach(function (img) {
      img.src = img.getAttribute('data-cam') + '?t=' + cameraStamp;
    });
  }
  setInterval(function () {
    if (document.hidden || preview) return;
    cameraStamp = Date.now();
    loadCameras();
  }, 10000);

  // --- Touch, mouse and keyboard --------------------------------------------------

  var tileById = function (tileId) {
    for (var i = 0; i < recipe.tiles.length; i += 1) if (recipe.tiles[i].id === tileId) return recipe.tiles[i];
    return null;
  };

  function optimisticFor(action) {
    if (action === 'toggle') {
      return function (id) {
        var st = states[id];
        if (!st) return {};
        var domain = domainOf(id);
        if (domain === 'cover') return { state: st.state === 'open' ? 'closing' : 'opening' };
        return { state: st.state === 'on' ? 'off' : 'on' };
      };
    }
    if (action === 'play_pause') {
      // The button turns over at once; the song's clock stops or goes on
      // from where it is now.
      return function (id) {
        var st = states[id];
        if (!st) return {};
        var playing = st.state === 'playing';
        var pos = positionNow(st.attributes || {}, playing);
        var attributes = { media_position_updated_at: new Date().toISOString() };
        if (pos !== null) attributes.media_position = pos;
        return { state: playing ? 'paused' : 'playing', attributes: attributes };
      };
    }
    return null;
  }

  var MEDIA_ACTIONS = { play_pause: true, next: true, previous: true };
  function perform(tile, action, value) {
    var opt = optimisticFor(action);
    var extra = opt ? { optimistic: opt } : {};
    if (MEDIA_ACTIONS[action]) {
      // A speaker can take a few seconds to answer: the button shows it was
      // heard, and a skipped song's details fade until the next one arrives.
      extra.busy = tile.id + ':' + action;
      extra.holdMs = 10000;
      if (action === 'next') {
        var st = stateOf(tile.entities[0]);
        skipping[tile.id] = { title: st && st.attributes ? st.attributes.media_title : null, until: Date.now() + 10000 };
      }
    }
    return act(tile, action, value, extra);
  }

  // Press and hold: a tile that needs it starts a ring on press and acts when
  // it completes; letting go early cancels. From the keyboard, a second press
  // within three seconds confirms.
  var holdTimer = null;
  var holdEl = null;
  function startHold(el, tile, action, value) {
    cancelHold();
    holdEl = el;
    el.style.setProperty('--hold-ms', HOLD_MS + 'ms');
    el.classList.add('holding');
    holdTimer = setTimeout(function () {
      el.classList.remove('holding');
      holdTimer = null;
      holdEl = null;
      perform(tile, action, value);
    }, HOLD_MS);
  }
  function cancelHold() {
    if (holdTimer) clearTimeout(holdTimer);
    holdTimer = null;
    if (holdEl) holdEl.classList.remove('holding');
    holdEl = null;
  }

  function trigger(target, viaKeyboard, pointerEvent) {
    var tileEl = target.closest('[data-tile]');
    if (!tileEl) return;
    var tile = tileById(tileEl.getAttribute('data-tile'));
    if (!tile) return;
    var st = stateOf(tile.entities[0]);
    var pick = target.closest('[data-pick]');
    if (pick) {
      openPicker(tile, st, pick.getAttribute('data-pick'));
      return;
    }
    var actionEl = target.closest('[data-action]');
    if (!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    var valueAttr = actionEl.getAttribute('data-value');
    var value = valueAttr == null ? undefined : Number(valueAttr);
    if (needsHold(tile, st)) {
      if (viaKeyboard) {
        if (holdArmed[tile.id] && Date.now() - holdArmed[tile.id] < 3000) {
          delete holdArmed[tile.id];
          perform(tile, action, value);
        } else {
          holdArmed[tile.id] = Date.now();
          flashHint(tile, T.holdKey);
        }
        return;
      }
      if (pointerEvent) startHold(tileEl, tile, action, value);
      return;
    }
    if (action === 'run') {
      tileEl.classList.add('flash');
      setTimeout(function () { tileEl.classList.remove('flash'); }, 450);
    }
    perform(tile, action, value);
  }

  // Sliders: a vertical drag on a dimmer or shade sets its level. A short tap
  // without movement toggles instead (opens or closes, for a shade).
  var dragging = null;
  app.addEventListener('pointerdown', function (event) {
    pressing = Date.now();
    if (event.target.closest('button') && navigator.vibrate) {
      try { navigator.vibrate(8); } catch (e) { /* not allowed here */ }
    }
    var slider = event.target.closest('[data-slider]');
    if (slider && !event.target.closest('button')) {
      var tile = tileById(slider.closest('[data-tile]').getAttribute('data-tile'));
      dragging = { el: slider, tile: tile, kind: slider.getAttribute('data-slider'), startY: event.clientY, startX: event.clientX, moved: false, pointerId: event.pointerId, value: null };
      try { slider.setPointerCapture(event.pointerId); } catch (e) { /* not capturable */ }
      return;
    }
    var holdTarget = event.target.closest('[data-action]');
    if (holdTarget) {
      var tileEl = holdTarget.closest('[data-tile]');
      var t = tileEl && tileById(tileEl.getAttribute('data-tile'));
      if (t && needsHold(t, stateOf(t.entities[0]))) {
        event.preventDefault();
        trigger(event.target, false, true);
      }
    }
  });
  app.addEventListener('pointermove', function (event) {
    if (!dragging || event.pointerId !== dragging.pointerId) return;
    var dy = event.clientY - dragging.startY;
    if (!dragging.moved && Math.abs(dy) < 8) return;
    dragging.moved = true;
    var rect = dragging.el.getBoundingClientRect();
    var fromBottom = 1 - (event.clientY - rect.top) / rect.height;
    var pct = Math.round(Math.max(0, Math.min(1, fromBottom)) * 100);
    dragging.value = pct;
    var fill = dragging.el.querySelector('.fill');
    if (fill) {
      var shown = dragging.kind === 'position' ? 100 - pct : pct;
      fill.style.height = shown + '%';
      fill.style.setProperty('--lvl', shown + '%');
    }
    dragging.el.setAttribute('aria-valuenow', String(pct));
  });
  function endDrag(event) {
    if (!dragging || (event && event.pointerId !== dragging.pointerId)) return;
    var d = dragging;
    dragging = null;
    if (d.moved && d.value !== null) {
      var patch = d.kind === 'position'
        ? { attributes: { current_position: d.value }, state: d.value > 0 ? 'open' : 'closed' }
        : d.kind === 'percentage'
          ? { attributes: { percentage: d.value }, state: d.value > 0 ? 'on' : 'off' }
          : { attributes: { brightness: Math.round(d.value * 2.55) }, state: d.value > 0 ? 'on' : 'off' };
      act(d.tile, d.kind, d.value, { optimistic: function () { return patch; } });
    } else if (event && event.type === 'pointerup') {
      var st = stateOf(d.tile.entities[0]);
      if (d.kind === 'position') {
        var rect = d.el.getBoundingClientRect();
        perform(d.tile, event.clientY - rect.top < rect.height / 2 ? 'open' : 'close');
      } else if (needsHold(d.tile, st)) {
        flashHint(d.tile, T.hold);
      } else {
        perform(d.tile, 'toggle');
      }
    }
    render();
  }
  app.addEventListener('pointerup', function (event) {
    if (dragging) { endDrag(event); return; }
    cancelHold();
  });
  app.addEventListener('pointercancel', function (event) {
    if (dragging) { dragging = null; render(); return; }
    cancelHold();
  });
  app.addEventListener('pointerleave', cancelHold);
  // The finger is up: redraw what came in meanwhile, after the tap is handled.
  function released() {
    if (!pressing) return;
    pressing = 0;
    if (redrawLater) {
      redrawLater = false;
      setTimeout(render, 0);
    }
  }
  window.addEventListener('pointerup', released, true);
  window.addEventListener('pointercancel', released, true);
  app.addEventListener('error', function (event) {
    if (event.target && event.target.classList && event.target.classList.contains('art')) event.target.classList.add('gone');
  }, true);

  function seekTo(tile, seconds) {
    var s = Math.max(0, Math.round(seconds));
    act(tile, 'seek', s, {
      optimistic: function () { return { attributes: { media_position: s, media_position_updated_at: new Date().toISOString() } }; },
      holdMs: 6000
    });
    tickProgress();
  }

  app.addEventListener('click', function (event) {
    var seekEl = event.target.closest('[data-seek]');
    if (seekEl) {
      var seekTile = tileById(seekEl.closest('[data-tile]').getAttribute('data-tile'));
      var seekSt = seekTile && stateOf(seekTile.entities[0]);
      var duration = seekSt && Number(seekSt.attributes.media_duration);
      if (!duration) return;
      var box = seekEl.getBoundingClientRect();
      seekTo(seekTile, Math.max(0, Math.min(1, (event.clientX - box.left) / box.width)) * duration);
      return;
    }
    var musicEl = event.target.closest('[data-library],[data-shuffle]');
    if (musicEl) {
      var musicTile = tileById(musicEl.closest('[data-tile]').getAttribute('data-tile'));
      if (!musicTile) return;
      if (preview) { flashHint(musicTile, T.previewNoActions); return; }
      if (musicEl.hasAttribute('data-library')) { openLibrary(musicTile); return; }
      var current = stateOf(musicTile.entities[0]);
      var next = !(current && current.attributes && current.attributes.shuffle);
      act(musicTile, 'shuffle', next, { optimistic: function () { return { attributes: { shuffle: next } }; } });
      return;
    }
    if (event.target.closest('[data-slider]') || event.target.closest('input')) return;
    var actionEl = event.target.closest('[data-action],[data-pick]');
    if (!actionEl) return;
    var tileEl = actionEl.closest('[data-tile]');
    var tile = tileEl && tileById(tileEl.getAttribute('data-tile'));
    // Held actions run from pointerdown; a click (from the keyboard) confirms.
    if (tile && needsHold(tile, stateOf(tile.entities[0])) && actionEl.hasAttribute('data-action')) {
      if (event.detail === 0) trigger(event.target, true, false);
      return;
    }
    trigger(event.target, false, false);
  });

  app.addEventListener('keydown', function (event) {
    var el = event.target;
    if (el.hasAttribute && el.hasAttribute('data-seek') && (event.key === 'ArrowRight' || event.key === 'ArrowLeft')) {
      event.preventDefault();
      var seekTile = tileById(el.closest('[data-tile]').getAttribute('data-tile'));
      var seekSt = seekTile && stateOf(seekTile.entities[0]);
      var at = seekSt && positionNow(seekSt.attributes || {}, seekSt.state === 'playing');
      if (at !== null && at !== undefined) seekTo(seekTile, at + (event.key === 'ArrowRight' ? 10 : -10));
      return;
    }
    if (el.hasAttribute && el.hasAttribute('data-slider') && (event.key === 'ArrowUp' || event.key === 'ArrowDown' || event.key === 'ArrowRight' || event.key === 'ArrowLeft')) {
      event.preventDefault();
      var tile = tileById(el.closest('[data-tile]').getAttribute('data-tile'));
      var now = Number(el.getAttribute('aria-valuenow')) || 0;
      var kind = el.getAttribute('data-slider');
      var up = event.key === 'ArrowUp' || event.key === 'ArrowRight';
      var next = Math.max(0, Math.min(100, now + (up ? 10 : -10)));
      act(tile, kind, next);
      return;
    }
    if ((event.key === 'Enter' || event.key === ' ') && el.hasAttribute && (el.hasAttribute('data-action') || el.hasAttribute('data-pick') || el.hasAttribute('data-slider'))) {
      if (el.tagName === 'BUTTON') return; // the click handler has it
      event.preventDefault();
      if (el.hasAttribute('data-slider')) {
        var sliderTile = tileById(el.closest('[data-tile]').getAttribute('data-tile'));
        perform(sliderTile, 'toggle');
        return;
      }
      trigger(el, true, false);
    }
  });

  // A volume slider fills as it moves, before the player is told.
  app.addEventListener('input', function (event) {
    var input = event.target.closest('input.level');
    if (input) input.style.setProperty('--pct', input.value + '%');
  });

  app.addEventListener('change', function (event) {
    var input = event.target.closest('[data-range]');
    if (!input) return;
    var tile = tileById(input.closest('[data-tile]').getAttribute('data-tile'));
    var range = input.getAttribute('data-range');
    var value = Number(input.value);
    act(tile, range, value, range === 'volume'
      ? { optimistic: function () { return { attributes: { volume_level: value / 100 } }; }, holdMs: 6000 }
      : null);
  });

  // --- Overlays ------------------------------------------------------------------

  function overlay(html, onMount, sheetClass) {
    var el = document.createElement('div');
    el.className = 'overlay';
    el.innerHTML = '<div class="sheet' + (sheetClass ? ' ' + sheetClass : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(el);
    var close = function () { el.remove(); };
    el.addEventListener('click', function (event) { if (event.target === el) close(); });
    el.addEventListener('keydown', function (event) { if (event.key === 'Escape') close(); });
    onMount(el, close);
    return close;
  }

  function askPin(error, done) {
    var pin = '';
    overlay(
      '<h2>' + esc(T.pinTitle) + '</h2><div class="dots" aria-hidden="true"></div>'
      + '<input type="password" inputmode="numeric" autocomplete="off" aria-label="' + esc(T.pinTitle) + '" style="position:absolute;opacity:0;width:1px;height:1px">'
      + '<div class="err" role="alert">' + esc(error || '') + '</div><div class="keys">'
      + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button type="button" class="btn" data-key="' + n + '">' + n + '</button>'; }).join('')
      + '<button type="button" class="btn" data-key="clear">' + esc(T.clearKey) + '</button><button type="button" class="btn" data-key="0">0</button>'
      + '<button type="button" class="btn primary" data-key="ok">' + esc(T.ok) + '</button></div>'
      + '<button type="button" class="btn" data-key="cancel">' + esc(T.cancel) + '</button>',
      function (el, close) {
        var dots = el.querySelector('.dots');
        var input = el.querySelector('input');
        var show = function () { dots.innerHTML = new Array(pin.length + 1).join('<span></span>'); };
        var submit = function () {
          if (!pin) return;
          close();
          done(pin);
        };
        input.addEventListener('input', function () { pin = input.value; show(); });
        input.addEventListener('keydown', function (event) { if (event.key === 'Enter') submit(); });
        el.addEventListener('click', function (event) {
          var key = event.target.closest('[data-key]');
          if (!key) return;
          var k = key.getAttribute('data-key');
          if (k === 'cancel') close();
          else if (k === 'ok') submit();
          else if (k === 'clear') { pin = ''; input.value = ''; show(); }
          else if (pin.length < 12) { pin += k; input.value = pin; show(); }
        });
        input.focus();
      }
    );
  }

  function openPicker(tile, st, which) {
    if (!st) return;
    if (preview) { flashHint(tile, T.previewNoActions); return; }
    var options = which === 'hvac_mode' ? (st.attributes.hvac_modes || []) : (st.attributes.options || []);
    var current = which === 'hvac_mode' ? st.state : st.state;
    var label = function (option) {
      if (which !== 'hvac_mode') return option;
      return T[option === 'off' ? 'off_mode' : option === 'dry' ? 'dry_mode' : option] || option;
    };
    overlay(
      '<h2>' + esc(tileName(tile, st)) + '</h2><div class="opts" role="listbox">'
      + options.map(function (option) {
        return '<button type="button" role="option" class="btn' + (option === current ? ' current' : '') + '" aria-selected="' + (option === current) + '" data-option="' + esc(option) + '">' + esc(label(option)) + '</button>';
      }).join('') + '</div><button type="button" class="btn" data-option-cancel>' + esc(T.cancel) + '</button>',
      function (el, close) {
        el.addEventListener('click', function (event) {
          if (event.target.closest('[data-option-cancel]')) { close(); return; }
          var opt = event.target.closest('[data-option]');
          if (!opt) return;
          close();
          act(tile, which === 'hvac_mode' ? 'hvac_mode' : 'select', opt.getAttribute('data-option'));
        });
        var first = el.querySelector('.current') || el.querySelector('[data-option]');
        if (first) first.focus();
      }
    );
  }

  // --- Music library ----------------------------------------------------------------

  // The player's library, a level at a time, and search with recent searches.
  // Everything comes from HomeGlow (routes/haPanels.js), which asks Home
  // Assistant; playing sends the item's key, never what it points at.
  function openLibrary(tile) {
    var entityId = tile.entities[0];
    var st = stateOf(entityId);
    var canBrowse = has(st, MEDIA_FEATURE.BROWSE_MEDIA);
    var canSearch = has(st, MEDIA_FEATURE.SEARCH_MEDIA);
    var base = mediaBase(entityId);
    var view = {
      tab: canBrowse ? 'browse' : 'search',
      stack: [],          // [{ key, title }] opened levels, root first
      level: null,        // the browse level shown
      query: '',
      found: null,        // { query, items }
      recent: null,
      busy: false,
      error: ''
    };
    var sheet;
    var closeSheet;

    var kindLabel = function (kind) { return T['kind_' + kind] || ''; };
    var thumbHtml = function (item) {
      var src = safeThumb(item.thumb);
      return src ? '<img class="thumb" alt="" loading="lazy" src="' + esc(src) + '">' : '<span class="thumb">' + svg(ICONS.music) + '</span>';
    };
    var itemHtml = function (item) {
      var go = item.canOpen
        ? '<span class="go" aria-hidden="true">' + glyph('open') + '</span>'
        : '<span class="go play" aria-hidden="true">' + glyph('play') + '</span>';
      var playButton = item.canOpen && item.canPlay
        ? '<button type="button" class="btn icon primary" data-play="' + esc(item.key) + '" data-title="' + esc(item.title) + '" aria-label="' + esc(T.play + ': ' + item.title) + '">' + glyph('play') + '</button>'
        : '';
      return '<div style="display:flex;align-items:center;gap:6px">'
        + '<button type="button" class="item" data-' + (item.canOpen ? 'open' : 'play') + '="' + esc(item.key) + '" data-title="' + esc(item.title) + '"'
        + ' aria-label="' + esc((item.canOpen ? T.openItem : T.play) + ': ' + item.title) + '">'
        + thumbHtml(item) + '<span class="t"><b>' + esc(item.title) + '</b><span>' + esc(kindLabel(item.kind)) + '</span></span>' + go + '</button>'
        + playButton + '</div>';
    };
    var list = function (items, empty) {
      if (!items || !items.length) return '<p class="lib-status">' + esc(empty) + '</p>';
      return items.map(itemHtml).join('');
    };

    function draw() {
      if (!sheet) return;
      var top = view.stack.length ? view.stack[view.stack.length - 1] : null;
      var inSearchResults = view.tab === 'search' && view.found;
      var showBack = (view.tab === 'browse' && view.stack.length > 0) || inSearchResults;
      var title = view.tab === 'browse' ? (top ? top.title : (view.level && view.level.title) || T.library) : T.search;
      var html = '<div class="lib-head">'
        + (showBack ? '<button type="button" class="btn icon quiet" data-back aria-label="' + esc(T.back) + '">' + glyph('back') + '</button>' : '')
        + '<h2>' + esc(title) + '</h2>'
        + (view.tab === 'browse' && view.level && view.level.canPlay && view.level.key && view.stack.length
          ? '<button type="button" class="btn primary" data-play="' + esc(view.level.key) + '" data-title="' + esc(title) + '">' + esc(T.playAll) + '</button>' : '')
        + '<button type="button" class="btn icon quiet" data-close aria-label="' + esc(T.close) + '">' + glyph('close') + '</button></div>';
      if (canBrowse && canSearch) {
        html += '<div class="tabs" role="tablist">'
          + '<button type="button" role="tab" class="btn' + (view.tab === 'browse' ? ' current' : '') + '" aria-selected="' + (view.tab === 'browse') + '" data-tab="browse">' + esc(T.browse) + '</button>'
          + '<button type="button" role="tab" class="btn' + (view.tab === 'search' ? ' current' : '') + '" aria-selected="' + (view.tab === 'search') + '" data-tab="search">' + esc(T.search) + '</button></div>';
      }
      if (view.tab === 'search') {
        html += '<form class="lib-search" data-search><input type="search" enterkeyhint="search" maxlength="100" autocomplete="off" placeholder="'
          + esc(T.searchPlaceholder) + '" aria-label="' + esc(T.search) + '" value="' + esc(view.query) + '">'
          + '<button type="submit" class="btn primary">' + esc(T.go) + '</button></form>';
      }
      html += '<div class="lib-body" aria-live="polite">';
      if (view.error) html += '<p class="lib-status err" role="alert">' + esc(view.error) + '</p>';
      if (view.busy) {
        html += '<p class="lib-status">' + esc(view.tab === 'search' ? T.searching : T.loading) + '</p>';
      } else if (view.tab === 'browse') {
        if (view.level) html += list(view.level.items, T.nothingHere);
      } else if (view.found) {
        html += list(view.found.items, T.noResults + ' "' + view.found.query + '"');
      } else if (view.recent && view.recent.length) {
        html += '<div class="lib-label"><span>' + esc(T.recent) + '</span><button type="button" class="btn" data-clear-recent>' + esc(T.clearRecent) + '</button></div>'
          + '<div class="chips">' + view.recent.map(function (q) {
            return '<button type="button" class="btn" data-recent="' + esc(q) + '">' + esc(q) + '</button>';
          }).join('') + '</div>';
      }
      html += '</div>';
      var hadFocusInSearch = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-search]');
      sheet.innerHTML = html;
      var input = sheet.querySelector('[data-search] input');
      if (input && (hadFocusInSearch || (!view.found && !view.busy && view.tab === 'search' && !(view.recent && view.recent.length)))) {
        input.focus();
        try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) { /* not a text field */ }
      }
    }

    function fail(error) {
      view.busy = false;
      view.error = (error && error.message) || T.failed;
      draw();
    }

    function browse(key, title) {
      view.busy = true;
      view.error = '';
      draw();
      return getJson(base + '/browse' + (key ? '?item=' + encodeURIComponent(key) : '')).then(function (level) {
        view.busy = false;
        view.level = level;
        if (key) view.stack.push({ key: key, title: title || level.title });
        draw();
      }).catch(function (error) {
        if (error.status === 410) {
          // HomeGlow restarted, or the list was long ago: start again from the top.
          view.stack = [];
          return browse(null).then(function () { view.error = T.staleList; draw(); });
        }
        fail(error);
      });
    }

    function back() {
      if (view.tab === 'search') {
        view.found = null;
        view.query = '';
        view.error = '';
        draw();
        return;
      }
      view.stack.pop();
      var parent = view.stack.pop();
      browse(parent ? parent.key : null, parent ? parent.title : null);
    }

    function loadRecent() {
      getJson(base + '/recent').then(function (data) {
        view.recent = (data && data.recent) || [];
        draw();
      }).catch(function () { view.recent = []; draw(); });
    }

    function search(query) {
      var q = String(query || '').trim();
      if (!q) return;
      view.query = q;
      view.busy = true;
      view.error = '';
      draw();
      getJson(base + '/search?q=' + encodeURIComponent(q)).then(function (data) {
        view.busy = false;
        view.found = { query: data.query, items: data.items };
        view.recent = data.recent || view.recent;
        draw();
      }).catch(fail);
    }

    function play(key, title) {
      view.error = '';
      fetch('/api/plugin/v1/ha/' + encodeURIComponent(pluginId) + '/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entity: entityId, action: 'play_media', value: key, device: device })
      }).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) {
            if (res.status === 410 && view.tab === 'browse') { view.stack = []; browse(null).then(function () { view.error = T.staleList; draw(); }); return; }
            fail(new Error((data && data.error) || T.failed));
            return;
          }
          Object.keys(data.entities || {}).forEach(function (id) { if (data.entities[id]) states[id] = data.entities[id]; });
          closeSheet();
          flashHint(tile, T.starting + ': ' + title);
        });
      }).catch(function () { fail(new Error(T.unreachable)); });
    }

    closeSheet = overlay('', function (el, close) {
      sheet = el.querySelector('.sheet');
      el.addEventListener('click', function (event) {
        var t = event.target;
        if (t.closest('[data-close]')) { close(); return; }
        if (t.closest('[data-back]')) { back(); return; }
        var tab = t.closest('[data-tab]');
        if (tab) {
          view.tab = tab.getAttribute('data-tab');
          view.error = '';
          if (view.tab === 'browse' && !view.level) browse(null); else draw();
          if (view.tab === 'search' && view.recent === null) loadRecent();
          return;
        }
        var playEl = t.closest('[data-play]');
        if (playEl) { play(playEl.getAttribute('data-play'), playEl.getAttribute('data-title') || ''); return; }
        var openEl = t.closest('[data-open]');
        if (openEl) { browse(openEl.getAttribute('data-open'), openEl.getAttribute('data-title')); return; }
        var recentEl = t.closest('[data-recent]');
        if (recentEl) { search(recentEl.getAttribute('data-recent')); return; }
        if (t.closest('[data-clear-recent]')) {
          view.recent = [];
          draw();
          fetch(base + '/recent', { method: 'DELETE' }).catch(function () { /* cleared here anyway */ });
        }
      });
      el.addEventListener('submit', function (event) {
        event.preventDefault();
        var input = event.target.querySelector('input');
        if (input) { input.blur(); search(input.value); }
      });
      el.addEventListener('input', function (event) {
        if (!event.target.closest('[data-search]')) return;
        view.query = event.target.value;
        // Clearing the box goes back to the recent searches.
        if (!view.query.trim() && view.found) { view.found = null; draw(); }
      });
      el.addEventListener('error', function (event) {
        if (event.target && event.target.classList && event.target.classList.contains('thumb')) event.target.style.visibility = 'hidden';
      }, true);
    }, 'library');

    if (view.tab === 'browse') browse(null); else { loadRecent(); draw(); }
  }

  // --- Running --------------------------------------------------------------------

  // The builder's preview sends the recipe it is editing.
  window.addEventListener('message', function (event) {
    if (!preview || event.source !== window.parent) return;
    var data = event.data;
    if (!data || data.type !== 'homeglow:ha-preview' || !data.recipe) return;
    recipe = data.recipe;
    render();
    poll();
  });

  // A nudge from HomeGlow that something changed: read again at once.
  var nudge = null;
  if (window.HomeGlow && !preview) {
    window.HomeGlow.on('ha.state', function (payload) {
      var ids = (payload && payload.entityIds) || [];
      var mine = entitiesWanted();
      if (!ids.some(function (id) { return mine.indexOf(id) !== -1; })) return;
      clearTimeout(nudge);
      nudge = setTimeout(poll, 150);
    });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  window.addEventListener('resize', function () { render(); });
  setInterval(poll, POLL_MS);
  render();
  poll();
})();
</script>
</body>
</html>
