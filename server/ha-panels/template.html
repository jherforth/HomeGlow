<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Assistant panel</title>
<!-- HA_PANEL_CONFIG -->
<script src="/plugin-sdk/v1.js"></script>
<style>
/* Home Assistant panel (issue #252): one template draws every panel from its
   recipe. Colors, radii, type and levels come from the theme's role tokens
   (the SDK writes them onto :root), each with a fallback. */
:root {
  --acc: var(--accent, #3a7cc4);
  --ink: var(--text, #1e2b3a);
  --ink-2: var(--text-secondary, #5a6b7d);
  --on-bg: var(--hg-button-bg, var(--acc));
  --on-ink: var(--hg-button-text, #ffffff);
  --level: var(--hg-meter-fill, var(--acc));
  --level-track: var(--hg-meter-track, rgba(127, 127, 127, 0.18));
  --tile-bg: color-mix(in srgb, var(--ink) 6%, transparent);
  --tile-radius: var(--hg-radius-md, 14px);
  --warn: var(--warning, #c9822b);
  --err: var(--hg-error, #c43d3d);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent !important; }
body {
  color: var(--ink);
  font-family: var(--hg-font-body, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overflow: hidden;
}
#app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding: clamp(6px, 2vmin, 12px); overflow: auto; }
.banner { margin: 0; padding: 8px 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; line-height: 1.35;
  background: color-mix(in srgb, var(--warn) 16%, transparent); }
.banner.error { background: color-mix(in srgb, var(--err) 14%, transparent); }
.grid { display: grid; gap: clamp(6px, 1.8vmin, 10px); grid-auto-flow: dense;
  grid-template-columns: repeat(var(--cols, auto-fill), minmax(var(--min, clamp(86px, 24vmin, 150px)), 1fr));
  grid-auto-rows: minmax(clamp(78px, 22vmin, 140px), auto); }
.grid.fixed { --min: 0px; }
.offline .tile { opacity: 0.55; }

.tile { position: relative; overflow: hidden; min-width: 0; min-height: 0; border: 0; margin: 0; font: inherit; color: inherit;
  border-radius: var(--tile-radius); background: var(--tile-bg); padding: clamp(8px, 2.4vmin, 14px); text-align: left;
  display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background 0.2s, color 0.2s, transform 0.1s; }
.tile.w2 { grid-column: span 2; }
.tile.h2 { grid-row: span 2; }
.tile.act { cursor: pointer; }
.tile.act:active { transform: scale(0.98); }
.tile:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.tile.on { background: var(--on-bg); color: var(--on-ink); }
.tile.on .sub { color: inherit; opacity: 0.85; }
.tile.missing { opacity: 0.5; }
.tile.flash { background: var(--on-bg); color: var(--on-ink); }
.tile.slide { touch-action: none; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; position: relative; z-index: 2; }
.ico { width: clamp(22px, 7vmin, 34px); height: clamp(22px, 7vmin, 34px); flex: none; display: grid; place-items: center; font-size: clamp(18px, 6vmin, 28px); line-height: 1; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tile:not(.on) .ico svg { stroke: var(--acc); }
.name { font-weight: 650; font-size: clamp(0.78rem, 3.4vmin, 1rem); line-height: 1.2; overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; position: relative; z-index: 2; }
.sub { font-size: clamp(0.7rem, 2.8vmin, 0.85rem); color: var(--ink-2); position: relative; z-index: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.big { font-size: clamp(1.1rem, 7vmin, 2rem); font-weight: 700; line-height: 1.05; position: relative; z-index: 2; }
.badge { font-size: 0.68rem; font-weight: 700; padding: 0.2em 0.6em; border-radius: 999px; background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--ink); }

/* Levels: brightness and fan speed fill from the bottom, a shade's closed
   part from the top. Drawn in the theme's meter color. */
.fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--level); opacity: 0.85; transition: height 0.2s; z-index: 1; }
.fill.down { top: 0; bottom: auto; }
.tile.leveled { background: var(--tile-bg); color: var(--ink); }
.tile.leveled.on .sub { color: var(--ink-2); }

.row { display: flex; gap: 6px; flex-wrap: wrap; position: relative; z-index: 2; }
.btn { appearance: none; border: 0; font: inherit; font-weight: 650; font-size: clamp(0.72rem, 2.8vmin, 0.9rem); cursor: pointer;
  min-height: 36px; min-width: 36px; padding: 0 0.8em; border-radius: var(--hg-button-radius, 999px);
  background: color-mix(in srgb, var(--acc) 14%, transparent); color: inherit; }
.btn:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.btn.primary { background: var(--on-bg); color: var(--on-ink); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.halves { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr 1fr; z-index: 3; }
.halves button { appearance: none; border: 0; background: transparent; cursor: pointer; color: transparent; }
.halves button:focus-visible { outline: 3px solid var(--acc); outline-offset: -3px; border-radius: var(--tile-radius); }
.chev { position: absolute; left: 50%; transform: translateX(-50%); width: 18px; height: 18px; opacity: 0.6; z-index: 2; }
.chev.up { top: 6px; } .chev.down { bottom: 6px; }
input[type=range] { width: 100%; accent-color: var(--level); position: relative; z-index: 2; }
.cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; border-radius: var(--tile-radius); }
.tile.camera { padding: 0; justify-content: flex-end; }
.tile.camera .name { padding: 6px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.55)); color: #fff; }

/* Press and hold: a ring fills while held. */
.ring { position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; z-index: 4; opacity: 0; transition: opacity 0.1s; }
.ring circle { fill: none; stroke: var(--acc); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 69.1; stroke-dashoffset: 69.1; }
.tile.on .ring circle { stroke: var(--on-ink); }
.holding .ring { opacity: 1; }
.holding .ring circle { transition: stroke-dashoffset var(--hold-ms, 650ms) linear; stroke-dashoffset: 0; }
.hint { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 5; font-size: 0.72rem; font-weight: 650; text-align: center;
  padding: 4px 6px; border-radius: 8px; background: color-mix(in srgb, var(--ink) 80%, transparent); color: var(--background, #fff); }

/* Small widgets: a compact list. */
.list { display: flex; flex-direction: column; gap: 6px; }
.list .tile { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; min-height: 48px; padding: 6px 10px; }
.list .tile > div:not(.top):not(.fill):not(.halves):not(.hint) { flex: 1; min-width: 0; }
.list .tile .row { flex: none; }
.list .tile .top { align-items: center; }
.list .tile .big { font-size: 1rem; }
.list .tile .fill { left: 0; top: 0; bottom: 0; height: auto !important; width: var(--lvl, 0%); right: auto; }
.list .tile .fill.down { width: var(--lvl, 0%); }

/* Overlays: the PIN pad and option lists. */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 10px;
  background: color-mix(in srgb, var(--background, #000) 72%, transparent); }
.sheet { width: min(320px, 100%); max-height: 100%; overflow: auto; border-radius: var(--hg-radius-lg, 18px); padding: 14px;
  background: var(--surface, #fff); color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 10px; }
.sheet h2 { margin: 0; font-size: 1rem; }
.dots { display: flex; gap: 8px; justify-content: center; min-height: 14px; }
.dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--acc); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keys .btn { min-height: 48px; font-size: 1.1rem; }
.err { color: var(--err); font-size: 0.85rem; font-weight: 600; text-align: center; min-height: 1.2em; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opts .btn { min-height: 44px; text-align: left; border-radius: 10px; }
.opts .btn.current { background: var(--on-bg); color: var(--on-ink); }
.empty { margin: auto; text-align: center; color: var(--ink-2); font-size: 0.9rem; }
/* A short widget: a tighter PIN pad, so it fits. */
@media (max-height: 460px) {
  .overlay { padding: 4px; }
  .sheet { padding: 10px; gap: 6px; }
  .keys { gap: 5px; }
  .keys .btn { min-height: 34px; font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

    cancelHold();
    holdEl = el;
    el.style.setProperty('--hold-ms', HOLD_MS + 'ms');
    el.classList.add('holding');
    holdTimer = setTimeout(function () {
      el.classList.remove('holding');
      holdTimer = null;
      holdEl = null;
      perform(tile, action, value);
    }, HOLD_MS);
  }
  function cancelHold() {
    if (holdTimer) clearTimeout(holdTimer);
    holdTimer = null;
    if (holdEl) holdEl.classList.remove('holding');
    holdEl = null;
  }

  function trigger(target, viaKeyboard, pointerEvent) {
    var tileEl = target.closest('[data-tile]');
    if (!tileEl) return;
    var tile = tileById(tileEl.getAttribute('data-tile'));
    if (!tile) return;
    var st = stateOf(tile.entities[0]);
    var pick = target.closest('[data-pick]');
    if (pick) {
      openPicker(tile, st, pick.getAttribute('data-pick'));
      return;
    }
    var actionEl = target.closest('[data-action]');
    if (!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    var valueAttr = actionEl.getAttribute('data-value');
    var value = valueAttr == null ? undefined : Number(valueAttr);
    if (needsHold(tile, st)) {
      if (viaKeyboard) {
        if (holdArmed[tile.id] && Date.now() - holdArmed[tile.id] < 3000) {
          delete holdArmed[tile.id];
          perform(tile, action, value);
        } else {
          holdArmed[tile.id] = Date.now();
          flashHint(tile, T.holdKey);
        }
        return;
      }
      if (pointerEvent) startHold(tileEl, tile, action, value);
      return;
    }
    if (action === 'run') {
      tileEl.classList.add('flash');
      setTimeout(function () { tileEl.classList.remove('flash'); }, 450);
    }
    perform(tile, action, value);
  }

  // Sliders: a vertical drag on a dimmer or shade sets its level. A short tap
  // without movement toggles instead (opens or closes, for a shade).
  var dragging = null;
  app.addEventListener('pointerdown', function (event) {
    var slider = event.target.closest('[data-slider]');
    if (slider && !event.target.closest('button')) {
      var tile = tileById(slider.closest('[data-tile]').getAttribute('data-tile'));
      dragging = { el: slider, tile: tile, kind: slider.getAttribute('data-slider'), startY: event.clientY, startX: event.clientX, moved: false, pointerId: event.pointerId, value: null };
      try { slider.setPointerCapture(event.pointerId); } catch (e) { /* not capturable */ }
      return;
    }
    var holdTarget = event.target.closest('[data-action]');
    if (holdTarget) {
      var tileEl = holdTarget.closest('[data-tile]');
      var t = tileEl && tileById(tileEl.getAttribute('data-tile'));
      if (t && needsHold(t, stateOf(t.entities[0]))) {
        event.preventDefault();
        trigger(event.target, false, true);
      }
    }
  });
  app.addEventListener('pointermove', function (event) {
    if (!dragging || event.pointerId !== dragging.pointerId) return;
    var dy = event.clientY - dragging.startY;
    if (!dragging.moved && Math.abs(dy) < 8) return;
    dragging.moved = true;
    var rect = dragging.el.getBoundingClientRect();
    var fromBottom = 1 - (event.clientY - rect.top) / rect.height;
    var pct = Math.round(Math.max(0, Math.min(1, fromBottom)) * 100);
    dragging.value = pct;
    var fill = dragging.el.querySelector('.fill');
    if (fill) {
      var shown = dragging.kind === 'position' ? 100 - pct : pct;
      fill.style.height = shown + '%';
      fill.style.setProperty('--lvl', shown + '%');
    }
    dragging.el.setAttribute('aria-valuenow', String(pct));
  });
  function endDrag(event) {
    if (!dragging || (event && event.pointerId !== dragging.pointerId)) return;
    var d = dragging;
    dragging = null;
    if (d.moved && d.value !== null) {
      var patch = d.kind === 'position'
        ? { attributes: { current_position: d.value }, state: d.value > 0 ? 'open' : 'closed' }
        : d.kind === 'percentage'
          ? { attributes: { percentage: d.value }, state: d.value > 0 ? 'on' : 'off' }
          : { attributes: { brightness: Math.round(d.value * 2.55) }, state: d.value > 0 ? 'on' : 'off' };
      act(d.tile, d.kind, d.value, { optimistic: function () { return patch; } });
    } else if (event && event.type === 'pointerup') {
      var st = stateOf(d.tile.entities[0]);
      if (d.kind === 'position') {
        var rect = d.el.getBoundingClientRect();
        perform(d.tile, event.clientY - rect.top < rect.height / 2 ? 'open' : 'close');
      } else if (needsHold(d.tile, st)) {
        flashHint(d.tile, T.hold);
      } else {
        perform(d.tile, 'toggle');
      }
    }
    render();
  }
  app.addEventListener('pointerup', function (event) {
    if (dragging) { endDrag(event); return; }
    cancelHold();
  });
  app.addEventListener('pointercancel', function (event) {
    if (dragging) { dragging = null; render(); return; }
    cancelHold();
  });
  app.addEventListener('pointerleave', cancelHold);

  app.addEventListener('click', function (event) {
    if (event.target.closest('[data-slider]') || event.target.closest('input')) return;
    var actionEl = event.target.closest('[data-action],[data-pick]');
    if (!actionEl) return;
    var tileEl = actionEl.closest('[data-tile]');
    var tile = tileEl && tileById(tileEl.getAttribute('data-tile'));
    // Held actions run from pointerdown; a click (from the keyboard) confirms.
    if (tile && needsHold(tile, stateOf(tile.entities[0])) && actionEl.hasAttribute('data-action')) {
      if (event.detail === 0) trigger(event.target, true, false);
      return;
    }
    trigger(event.target, false, false);
  });

  app.addEventListener('keydown', function (event) {
    var el = event.target;
    if (el.hasAttribute && el.hasAttribute('data-slider') && (event.key === 'ArrowUp' || event.key === 'ArrowDown' || event.key === 'ArrowRight' || event.key === 'ArrowLeft')) {
      event.preventDefault();
      var tile = tileById(el.closest('[data-tile]').getAttribute('data-tile'));
      var now = Number(el.getAttribute('aria-valuenow')) || 0;
      var kind = el.getAttribute('data-slider');
      var up = event.key === 'ArrowUp' || event.key === 'ArrowRight';
      var next = Math.max(0, Math.min(100, now + (up ? 10 : -10)));
      act(tile, kind, next);
      return;
    }
    if ((event.key === 'Enter' || event.key === ' ') && el.hasAttribute && (el.hasAttribute('data-action') || el.hasAttribute('data-pick') || el.hasAttribute('data-slider'))) {
      if (el.tagName === 'BUTTON') return; // the click handler has it
      event.preventDefault();
      if (el.hasAttribute('data-slider')) {
        var sliderTile = tileById(el.closest('[data-tile]').getAttribute('data-tile'));
        perform(sliderTile, 'toggle');
        return;
      }
      trigger(el, true, false);
    }
  });

  app.addEventListener('change', function (event) {
    var input = event.target.closest('[data-range]');
    if (!input) return;
    var tile = tileById(input.closest('[data-tile]').getAttribute('data-tile'));
    act(tile, input.getAttribute('data-range'), Number(input.value));
  });

  // --- Overlays ------------------------------------------------------------------

  function overlay(html, onMount) {
    var el = document.createElement('div');
    el.className = 'overlay';
    el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(el);
    var close = function () { el.remove(); };
    el.addEventListener('click', function (event) { if (event.target === el) close(); });
    el.addEventListener('keydown', function (event) { if (event.key === 'Escape') close(); });
    onMount(el, close);
    return close;
  }

  function askPin(error, done) {
    var pin = '';
    overlay(
      '<h2>' + esc(T.pinTitle) + '</h2><div class="dots" aria-hidden="true"></div>'
      + '<input type="password" inputmode="numeric" autocomplete="off" aria-label="' + esc(T.pinTitle) + '" style="position:absolute;opacity:0;width:1px;height:1px">'
      + '<div class="err" role="alert">' + esc(error || '') + '</div><div class="keys">'
      + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button type="button" class="btn" data-key="' + n + '">' + n + '</button>'; }).join('')
      + '<button type="button" class="btn" data-key="clear">' + esc(T.clearKey) + '</button><button type="button" class="btn" data-key="0">0</button>'
      + '<button type="button" class="btn primary" data-key="ok">' + esc(T.ok) + '</button></div>'
      + '<button type="button" class="btn" data-key="cancel">' + esc(T.cancel) + '</button>',
      function (el, close) {
        var dots = el.querySelector('.dots');
        var input = el.querySelector('input');
        var show = function () { dots.innerHTML = new Array(pin.length + 1).join('<span></span>'); };
        var submit = function () {
          if (!pin) return;
          close();
          done(pin);
        };
        input.addEventListener('input', function () { pin = input.value; show(); });
        input.addEventListener('keydown', function (event) { if (event.key === 'Enter') submit(); });
        el.addEventListener('click', function (event) {
          var key = event.target.closest('[data-key]');
          if (!key) return;
          var k = key.getAttribute('data-key');
          if (k === 'cancel') close();
          else if (k === 'ok') submit();
          else if (k === 'clear') { pin = ''; input.value = ''; show(); }
          else if (pin.length < 12) { pin += k; input.value = pin; show(); }
        });
        input.focus();
      }
    );
  }

  function openPicker(tile, st, which) {
    if (!st) return;
    if (preview) { flashHint(tile, T.previewNoActions); return; }
    var options = which === 'hvac_mode' ? (st.attributes.hvac_modes || []) : (st.attributes.options || []);
    var current = which === 'hvac_mode' ? st.state : st.state;
    var label = function (option) {
      if (which !== 'hvac_mode') return option;
      return T[option === 'off' ? 'off_mode' : option === 'dry' ? 'dry_mode' : option] || option;
    };
    overlay(
      '<h2>' + esc(tileName(tile, st)) + '</h2><div class="opts" role="listbox">'
      + options.map(function (option) {
        return '<button type="button" role="option" class="btn' + (option === current ? ' current' : '') + '" aria-selected="' + (option === current) + '" data-option="' + esc(option) + '">' + esc(label(option)) + '</button>';
      }).join('') + '</div><button type="button" class="btn" data-option-cancel>' + esc(T.cancel) + '</button>',
      function (el, close) {
        el.addEventListener('click', function (event) {
          if (event.target.closest('[data-option-cancel]')) { close(); return; }
          var opt = event.target.closest('[data-option]');
          if (!opt) return;
          close();
          act(tile, which === 'hvac_mode' ? 'hvac_mode' : 'select', opt.getAttribute('data-option'));
        });
        var first = el.querySelector('.current') || el.querySelector('[data-option]');
        if (first) first.focus();
      }
    );
  }

  // --- Running --------------------------------------------------------------------

  // The builder's preview sends the recipe it is editing.
  window.addEventListener('message', function (event) {
    if (!preview || event.source !== window.parent) return;
    var data = event.data;
    if (!data || data.type !== 'homeglow:ha-preview' || !data.recipe) return;
    recipe = data.recipe;
    render();
    poll();
  });

  // A nudge from HomeGlow that something changed: read again at once.
  var nudge = null;
  if (window.HomeGlow && !preview) {
    window.HomeGlow.on('ha.state', function (payload) {
      var ids = (payload && payload.entityIds) || [];
      var mine = entitiesWanted();
      if (!ids.some(function (id) { return mine.indexOf(id) !== -1; })) return;
      clearTimeout(nudge);
      nudge = setTimeout(poll, 150);
    });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  window.addEventListener('resize', function () { render(); });
  setInterval(poll, POLL_MS);
  render();
  poll();
})();
</script>
</body>
</html>
