name: Build and Publish Docker Images

on:
  push:
    # branches:
    #   - main
    #   - Testing
    tags:
      - 'v*'
  workflow_dispatch:
  # Nightly :latest-test from main, at 08:17 UTC (just after midnight
  # Pacific). The check-main job below skips the build when main hasn't
  # changed since its last image, so a quiet night builds nothing.
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read
  packages: write
  # check-main reads this repository's workflow runs.
  actions: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Nightly runs only: build main when it has changed. github.sha is main's
  # newest commit on a scheduled run. It is skipped when this workflow
  # already succeeded for that commit (a manual or earlier nightly build),
  # and when CI Tests hasn't passed for it, so a broken main never becomes
  # :latest-test. A tag push or a manual run never asks, and always builds.
  check-main:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Has main changed since its last image?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          successes() {
            gh api "repos/${REPO}/actions/workflows/$1/runs?status=success&head_sha=${SHA}&per_page=1" --jq .total_count
          }
          if [[ "$(successes docker-image.yml)" -gt 0 ]]; then
            echo "main (${SHA::7}) already has an image; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [[ "$(successes ci-tests.yml)" -eq 0 ]]; then
            echo "::warning::CI Tests hasn't passed for main (${SHA::7}); skipping tonight's :latest-test."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved to ${SHA::7}; building :latest-test."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check-main
    # check-main is skipped outside nightly runs; then always build.
    if: ${{ !cancelled() && (needs.check-main.result == 'skipped' || needs.check-main.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./client
            dockerfile: ./client/Dockerfile
            image: homeglow-frontend
            platforms: linux/amd64,linux/arm64
          - name: backend
            context: ./server
            dockerfile: ./server/Dockerfile
            image: homeglow-backend
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Compute build metadata
        id: buildmeta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "app_version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "git_commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 cross-builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
# tags options:
# type=ref,event=branch
# type=sha,format=short
# ,enable={{is_default_branch}} # Could be used if we want to auto-publish on default branch
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest-test
            # Publish :latest only on a v* tag release, never on the nightly
            # or workflow_dispatch test builds (those keep publishing only
            # :latest-test). Keeps :latest == the newest stable release, which
            # docker-compose.yml and the Proxmox install script both pull.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ steps.buildmeta.outputs.app_version }}
            VITE_GIT_COMMIT=${{ steps.buildmeta.outputs.git_commit }}
            VITE_GITHUB_REPOSITORY=${{ steps.buildmeta.outputs.repository }}
            BACKEND_VERSION=${{ steps.buildmeta.outputs.app_version }}
            BACKEND_GIT_COMMIT=${{ steps.buildmeta.outputs.git_commit }}
            BACKEND_GITHUB_REPOSITORY=${{ steps.buildmeta.outputs.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
