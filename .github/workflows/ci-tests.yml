name: CI Tests

on:
  push:
    branches:
      - '**'
  # Without this, a pull request from a fork gets no CI at all: `push` only
  # fires for branches in this repository, and a fork's branch never is one.
  # Five external contributions were merged on a reviewer running the suites
  # by hand before this was added.
  #
  # Deliberately `pull_request`, not `pull_request_target`: this checks out
  # and runs the contributor's code, so it must keep the read-only token and
  # no access to secrets. `pull_request_target` would hand an untrusted branch
  # a privileged token.
  pull_request:

permissions:
  contents: read

concurrency:
  # Key on the PR head where there is one, so a branch in this repository that
  # also has a PR open collapses its push run and its pull_request run into a
  # single group instead of testing the same commit twice. A fork PR has a
  # distinct head label, so it is unaffected.
  group: ci-tests-${{ github.event.pull_request.head.label || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            path: ./client
          - name: backend
            path: ./server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies (${{ matrix.name }})
        run: npm install
        working-directory: ${{ matrix.path }}

      - name: Run tests (${{ matrix.name }})
        run: npm test
        working-directory: ${{ matrix.path }}

      # Every English key must exist in every other language (issue #137), so a
      # new string can't ship as untranslated text in a translated UI.
      - name: Check translation completeness
        if: matrix.name == 'frontend'
        run: npm run check:i18n
        working-directory: ${{ matrix.path }}
