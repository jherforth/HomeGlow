# The scheme the client used. A TLS proxy in front of this server (for
# example one terminating HTTPS in the same container) sends it as
# X-Forwarded-Proto; without one, it is this server's own scheme. Passing it on
# is what lets the backend build https:// redirect addresses, such as Google's.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen ${FRONTEND_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API proxy to backend. `^~` for the same reason as /plugin-sdk/ below: the
    # static-asset regex would otherwise capture API paths ending in .svg,
    # .png, .jpg or .woff2 (theme files, background photos) and 404 them.
    location ^~ /api/ {
        proxy_pass http://${BACKEND_SERVICE}:${BACKEND_PORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
        # nginx's default is 1 MB, which refuses a single phone photo with a bare
        # 413 before the backend sees it. The backend limits each file to 25 MB;
        # this leaves room for several in one upload, so an oversized file is
        # refused by the backend, with a message, rather than here.
        client_max_body_size 100m;
    }

    # Uploads are served at /Uploads/ only; the backend has no lowercase route.
    # Send the lowercase spelling there rather than proxying it to a 404 that
    # reads like a missing file. Must come before static file caching.
    location /uploads/ {
        absolute_redirect off;
        rewrite ^/uploads/(.*)$ /Uploads/$1 permanent;
    }

    location /Uploads/ {
        proxy_pass http://${BACKEND_SERVICE}:${BACKEND_PORT}/Uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $arg_nocache;
        add_header X-Proxy-Cache $upstream_cache_status;
    }

    # Widgets proxy
    location /widgets/ {
        proxy_pass http://${BACKEND_SERVICE}:${BACKEND_PORT}/widgets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Plugin SDK, served by the backend. `^~` is required: regex locations are
    # matched before prefix locations, so the static-asset regex below would
    # otherwise capture /plugin-sdk/v1.js and try_files it to a 404.
    location ^~ /plugin-sdk/ {
        proxy_pass http://${BACKEND_SERVICE}:${BACKEND_PORT}/plugin-sdk/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The Home Assistant panel template, for the builder's live preview in
    # Admin (issue #252), served by the backend. Without this the path fell
    # through to the app's index.html, and the preview showed HomeGlow itself.
    location ^~ /ha-panels/ {
        proxy_pass http://${BACKEND_SERVICE}:${BACKEND_PORT}/ha-panels/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Theme stylesheet plugins link as /index.css (see the plugin development
    # guide). Exact match, so it wins over the static-asset regex without
    # shadowing the hashed stylesheets under /assets/.
    #
    # Served from this image, not proxied to the backend. The backend builds with
    # server/ as its Docker context, so it never contains client/src/index.css
    # and answered every one of these requests with a 500. This is a client
    # asset; it lives where the other client assets live.
    location = /index.css {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Cache static assets from build - but NOT from /Uploads/ or /uploads/
    location ~* ^/(?!Uploads|uploads|widgets).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep HTML fresh so clients always discover latest hashed bundles
    location = /index.html {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # React Router - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
